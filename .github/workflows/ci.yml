        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-target
          cache-targets: false
          shared-key: redis-compat-release-proof

      - name: Check Docker availability
        run: |
