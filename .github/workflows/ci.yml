    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-target
          cache-targets: false
          shared-key: dst-nightly-soak

      - name: Run deterministic simulation seeds
        run: |
          cargo run -p hydracache-sim --bin vopr --locked -- --seed 44 --steps 512
          cargo run -p hydracache-sim --bin vopr --locked -- --seed 45 --steps 512
          cargo run -p hydracache-sim --bin vopr --locked -- --seed 46 --steps 512

      - name: Run continuous soak and write SOAK_REPORT
        timeout-minutes: 20
        run: |
          cargo run -p hydracache-sim --bin vopr --locked -- soak --master-seed 22530 --budget-secs 60 --steps-per-seed 512 --max-seeds 128 | tee SOAK_REPORT.json

      - name: Run ignored resource and operator skip sentinels
        run: |
          cargo test -p hydracache-server --test soak_resource --locked -- --ignored --nocapture
          cargo test -p hydracache-operator --test soak_kind --locked -- --ignored --nocapture

      - name: Run networked daemon E2E tier
        env:
          HYDRACACHE_RUN_NETWORKED_DAEMON_E2E: "1"
        run: cargo test -p hydracache-server --test grid_host multi_node --locked -- --nocapture

      - name: Run daemon-process cluster tier
        run: cargo run -p xtask --locked -- evidence-run --release 0.64 --gate env.hydracache-run-daemon-process-e2e

      - name: Redis RESP multinode debt sentinels
        run: cargo run -p xtask --locked -- evidence-run --release 0.65 --gate env.hydracache-run-redis-resp-multinode-e2e

      - name: Upload daemon-process replay artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daemon-process-replay-artifacts
          path: target/test-hydracache-daemon-process/**
          if-no-files-found: ignore

      - name: Upload daemon-process evidence receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "daemon-process-evidence-${{ github.sha }}"
          path: target/release-evidence/receipts/**
          if-no-files-found: error

      - name: Run membership-history tier
        env:
          HYDRACACHE_RUN_DAEMON_PROCESS_E2E: "1"
        run: cargo test -p hydracache-server --test membership_history --locked -- --nocapture

      - name: Run pre-vote nightly soak
        timeout-minutes: 30
        env:
          HYDRACACHE_RUN_PREVOTE_NIGHTLY_SOAK: "1"
        run: cargo test -p hydracache-cluster-raft --test prevote_nightly_soak --locked -- --nocapture

      - name: Run raft nemesis nightly soak
        timeout-minutes: 30
        env:
          HYDRACACHE_RUN_RAFT_NEMESIS_SOAK: "1"
          HYDRACACHE_NEMESIS_BUDGET_SECS: "60"
        run: cargo test -p hydracache-cluster-raft --test nemesis_membership nemesis_soak_over_seed_range_converges --locked -- --nocapture

      - name: Upload SOAK_REPORT
        uses: actions/upload-artifact@v6
        with:
          name: SOAK_REPORT
          path: SOAK_REPORT.json

  raft-corner-case-nightly:
    name: Raft Corner-Case Nightly
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-no-target
          cache-targets: false
          shared-key: raft-corner-case-nightly

      - name: Raft nemesis soak
        timeout-minutes: 60
        run: cargo run -p xtask --locked -- evidence-run --release 0.64 --gate env.hydracache-run-raft-nemesis-soak

      - name: Snapshot exhaustive grid wide
        run: cargo run -p xtask --locked -- evidence-run --release 0.64 --gate env.hydracache-grid-scope

      - name: Rejoin after compaction proof
        run: cargo run -p xtask --locked -- evidence-run --release 0.64 --gate cfg.hydracache-cluster-raft.rejoin-after-compaction

      - name: Snapshot resource faults
        run: cargo run -p xtask --locked -- evidence-run --release 0.64 --gate cfg.hydracache-cluster-raft.snapshot-resource-faults

      - name: W39c Raft cancellation safety
        run: cargo run -p xtask --locked -- evidence-run --release 0.64 --gate env.hydracache-run-cancellation-raft

      - name: Clock skew safety
        run: cargo test -p hydracache-sim --test clock_skew_safety --locked -- --nocapture

      - name: Upload raft corner-case artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raft-corner-case-artifacts
          path: |
            target/hydracache-contradiction-ledger/**
            target/hydracache-daemon-logs/**
            target/test-hydracache-daemon-process/**
            target/release-evidence/receipts/**
          if-no-files-found: ignore

  release-066-daemon-process:
    name: 0.66 Daemon Process Release Proof
    runs-on: ubuntu-latest
    timeout-minutes: 130
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust-with-target
          cache-targets: true
          shared-key: release-066-daemon-process

      - name: Verify shipped 0.65 provenance
        run: |
          git rev-parse --verify refs/tags/v0.65.0
          git merge-base --is-ancestor refs/tags/v0.65.0 HEAD

      - name: Run 0.66 daemon-process release proof
        run: cargo run -p xtask --locked -- evidence-run --release 0.66 --gate env.hydracache-run-066-daemon-process-e2e

      - name: Upload 0.66 daemon-process evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "daemon-process-066-${{ github.sha }}"
          path: |
            target/test-hydracache-daemon-process/**
            target/test-evidence/0.66/**
            target/release-evidence/receipts/**
          if-no-files-found: error

  release-066-operator-kind:
    name: 0.66 Operator Kind Release Proof
    runs-on: ubuntu-latest
    timeout-minutes: 130
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.4"
          cache: false

      - name: Install kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.32.0

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.17.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust-with-target
          cache-targets: true
          shared-key: release-066-operator-kind

      - name: Create kind cluster with enforcing CNI
        shell: bash
        run: |
          go install sigs.k8s.io/kind@v0.26.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/kind" create cluster \
            --name hydracache-066 \
            --image kindest/node:v1.32.0@sha256:c48c62eac5da28cdadcf560d1d8616cfa6783b58f0d94cf63ad1bf49600cb027 \
            --config - <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          EOF
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.2/manifests/calico.yaml
          kubectl rollout status deployment/calico-kube-controllers -n kube-system --timeout=5m
          kubectl rollout status daemonset/calico-node -n kube-system --timeout=5m

      - name: Install required Chaos Mesh IOChaos runtime
        timeout-minutes: 15
        run: |
          helm repo add chaos-mesh https://charts.chaos-mesh.org
          helm repo update
          helm install chaos-mesh chaos-mesh/chaos-mesh \
            --namespace chaos-mesh \
            --create-namespace \
            --version 2.7.2 \
            --set chaosDaemon.runtime=containerd \
            --set chaosDaemon.socketPath=/run/containerd/containerd.sock \
            --wait \
            --timeout 10m
          kubectl get crd iochaos.chaos-mesh.org

      - name: Build and load current server image
        run: |
          docker build --tag hydracache-server:0.66-candidate .
          kind load docker-image --name hydracache-066 hydracache-server:0.66-candidate

      - name: Prepare current operator controller
        shell: bash
        run: |
          mkdir -p target/test-evidence/0.66
          kubectl apply -f deploy/operator/hydracacheclusters.hydracache.io.crd.yaml
          kubectl auth can-i get pods --subresource=proxy --namespace default
          kubectl auth can-i create pods --subresource=proxy --namespace default
          cargo build -p hydracache-operator --locked
          operator_candidate_directory="$(pwd)/target/ci-runtime/0.66"
          operator_binary="$operator_candidate_directory/hydracache-operator-${GITHUB_SHA}"
          mkdir -p "$operator_candidate_directory"
          install -m 0755 "$(pwd)/target/debug/hydracache-operator" "$operator_binary"
          operator_log="target/test-evidence/0.66/operator-controller-live.log"
          operator_nonce="release-066-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          export HYDRACACHE_OPERATOR_EVIDENCE_NONCE="$operator_nonce"
          echo "HYDRACACHE_OPERATOR_EVIDENCE_NONCE=$operator_nonce" >> "$GITHUB_ENV"
          echo "HYDRACACHE_OPERATOR_BINARY=$operator_binary" >> "$GITHUB_ENV"
          printf 'HC-OPERATOR-CONTROLLER-START nonce=%s binary=%s\n' \
            "$operator_nonce" "$operator_binary" > "$operator_log"

      - name: Start current operator controller
        id: operator-controller
        shell: bash
        background: true
        timeout-minutes: 120
        env:
          HYDRACACHE_OPERATOR_NAMESPACE: default
          HYDRACACHE_OPERATOR_IDENTITY: release-066-ci
        run: |
          operator_log="target/test-evidence/0.66/operator-controller-live.log"
          operator_pid_file="target/test-evidence/0.66/operator-controller.pid"
          printf '%s\n' "$BASHPID" > "$operator_pid_file"
          exec "$HYDRACACHE_OPERATOR_BINARY" >> "$operator_log" 2>&1

      - name: Verify current operator controller
        shell: bash
        run: |
          operator_log="target/test-evidence/0.66/operator-controller-live.log"
          operator_pid_file="target/test-evidence/0.66/operator-controller.pid"
          operator_nonce="$HYDRACACHE_OPERATOR_EVIDENCE_NONCE"
          operator_ready=0
          for _ in $(seq 1 30); do
            if [[ -s "$operator_pid_file" ]]; then
              operator_pid="$(cat "$operator_pid_file")"
            else
              sleep 1
              continue
            fi
            if kill -0 "$operator_pid" \
              && grep -Fq "HC-OPERATOR-CONTROLLER-RUNTIME nonce=$operator_nonce " "$operator_log"; then
              operator_ready=1
              break
            fi
            sleep 1
          done
          kill -0 "$operator_pid"
          test "$operator_ready" = 1
          grep -F "HC-OPERATOR-CONTROLLER-RUNTIME nonce=$operator_nonce " "$operator_log"

      - name: Run 0.66 operator-kind release proof
        run: cargo run -p xtask --locked -- evidence-run --release 0.66 --gate env.hydracache-operator-kind-066

      - name: Stop current operator controller
        cancel: operator-controller

      - name: Capture operator-kind diagnostics
        if: always()
        continue-on-error: true
        run: |
          kubectl get pods,statefulsets,services,hydracacheclusters -A -o wide > target/test-evidence/0.66/operator-kind-resources-post.txt || true
          kubectl get events -A --sort-by=.lastTimestamp > target/test-evidence/0.66/operator-kind-events-post.txt || true
          kubectl logs -n default \
            --selector 'app.kubernetes.io/name=hydracache,app.kubernetes.io/instance=hydracache-066,app.kubernetes.io/component=server' \
            --all-containers=true \
            --prefix=true \
            --tail=-1 \
            > target/test-evidence/0.66/operator-kind-pod-logs-post.txt || true

      - name: Upload 0.66 operator-kind evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "operator-kind-066-${{ github.sha }}"
          path: |
            target/test-evidence/0.66/**
            target/release-evidence/receipts/**
          if-no-files-found: error

  performance-067-shared-tripwire:
    name: 0.67 Shared Performance Tripwire
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_nightly && !inputs.run_reference_performance && inputs.candidate_release == '0.67')

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Validate shared-runner tripwire policy
        run: cargo test -p xtask --test perf_budget_067 --locked ci_shared_is_a_rolling_only_non_enforcing_tripwire

      - name: Evaluate non-ship shared-runner tripwire
        run: cargo run -p xtask --locked -- perf-budget-check --release 0.67 --profile ci-shared

      - name: Upload 0.67 shared tripwire
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "performance-shared-tripwire-067-${{ github.sha }}"
          path: target/test-evidence/0.67/perf-budget-verdict.json
          if-no-files-found: error

  performance-ci-instruction-v1:
    name: CI Instruction Work Tripwire
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    steps:
      - name: Checkout paired history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Install Callgrind
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
          cargo install --locked gungraun-runner --version 0.19.4
          gungraun-runner --version

      - name: Resolve exact comparison commits
        id: commits
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Validate non-ship instruction profile
        run: cargo test -p xtask --test perf_ci_instruction --locked

      - name: Run paired base/head instruction tripwire
        run: |
          scripts/perf/run-ci-instruction-pair.sh \
            --base '${{ steps.commits.outputs.base_sha }}' \
            --head '${{ steps.commits.outputs.head_sha }}' \
            --output target/test-evidence/ci-instruction-v1

      - name: Upload instruction profiles and receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "ci-instruction-v1-${{ steps.commits.outputs.head_sha }}"
          path: target/test-evidence/ci-instruction-v1/**
          if-no-files-found: error

  release-067-performance:
    name: 0.67 Self-hosted Reference Evidence
    runs-on: [self-hosted, linux, x64, hydracache-perf-v1]
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_reference_performance && inputs.candidate_release == '0.67'
    concurrency:
      group: release-067-performance-reference-v1
      cancel-in-progress: false
    env:
      HYDRACACHE_RUN_PERF_REFERENCE: 1
      HYDRACACHE_PERF_RUNNER_CLASS: self-hosted-bare-metal-v1
      # The exploratory 0.67 lane uses the same commit-bound tmpfs publication
      # contract as qualification, while the 0.67.1 jobs remain opt-in.
      HYDRACACHE_PERFORMANCE_0671_MODE: qualify

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Build pinned redis-benchmark 7.2.5
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/hydracache-perf-tools"
          mkdir --parents "$tools_dir"
          cd "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 \
            --output redis-7.2.5.tar.gz \
            https://download.redis.io/releases/redis-7.2.5.tar.gz
          printf '%s  redis-7.2.5.tar.gz\n' '5981179706f8391f03be91d951acafaeda91af7fac56beffb2701963103e423d' \
            | sha256sum --check --strict -
          tar --extract --gzip --file redis-7.2.5.tar.gz
          env -i PATH=/usr/bin:/bin HOME=/tmp CC=gcc MALLOC=libc BUILD_TLS=no \
            make -C redis-7.2.5 -j1 redis-benchmark
          test "$(redis-7.2.5/src/redis-benchmark --version)" = "redis-benchmark 7.2.5"
          echo "$tools_dir/redis-7.2.5/src" >> "$GITHUB_PATH"

      - name: Verify shipped 0.66 provenance
        run: |
          git rev-parse --verify refs/tags/v0.66.0
          git merge-base --is-ancestor refs/tags/v0.66.0 HEAD

      - name: Run 0.67 canary sweep
        run: cargo run -p xtask --locked -- canary-sweep --release 0.67 --tier all

      - name: Validate 0.67 performance contract
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate fast.performance-contract-067

      - name: Clear only prior performance evidence scratch
        shell: bash
        run: |
          rm -rf -- \
            target/test-evidence/0.67 \
            target/test-evidence/0.67.1

      - name: Prepare tmpfs reference evidence
        run: scripts/perf/reference-evidence-tmpfs.sh prepare

      - name: Preflight 0.67 reference runner stability
        run: scripts/perf/run-reference-measurement.sh attestation

      - name: Prebuild 0.67 performance binaries
        # The runner service is intentionally pinned to housekeeping CPUs; the
        # prebuild observation itself must run on the measurement CPUs expected
        # by the reference-v1 contract.
        run: taskset --cpu-list 1-4 cargo run -p xtask --locked -- evidence-run --release 0.67 --gate tool.perf-prebuild-067

      - name: Run 0.67 core performance evidence
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate env.hydracache-run-067-perf-core

      - name: Run 0.67 RESP performance evidence
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate env.hydracache-run-067-perf-resp

      - name: Run 0.67 control-plane performance evidence
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate env.hydracache-run-067-perf-control-plane

      - name: Materialize tmpfs reference evidence
        if: always()
        run: scripts/perf/reference-evidence-tmpfs.sh materialize

      - name: Check 0.67 performance budgets
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate tool.perf-budget-check-067

      - name: Aggregate exact 0.67 candidate evidence
        run: cargo run -p xtask --locked -- release-evidence --release 0.67 --receipts-dir target/release-evidence/receipts --require-ship

      - name: Upload 0.67 performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "performance-067-${{ github.sha }}"
          path: |
            target/test-evidence/0.67/**
            target/release-evidence/canaries/0.67-*.json
            target/release-evidence/receipts/**
          if-no-files-found: error

  release-0671-performance-qualification:
    name: 0.67.1 Dedicated Runner Qualification
    runs-on: [self-hosted, linux, x64, hydracache-perf-v1]
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.performance_0671_mode == 'qualify' && inputs.candidate_release == '0.67.1'
    concurrency:
      group: release-067-performance-reference-v1
      cancel-in-progress: false
    env:
      HYDRACACHE_RUN_PERF_REFERENCE: 1
      HYDRACACHE_PERF_RUNNER_CLASS: self-hosted-bare-metal-v1
      HYDRACACHE_PERFORMANCE_0671_MODE: qualify

    steps:
      - name: Validate optional campaign correlation
        shell: bash
        env:
          HYDRACACHE_CAMPAIGN: ${{ inputs.performance_0671_campaign }}
        run: |
          if [[ -n "$HYDRACACHE_CAMPAIGN" ]]; then
            [[ "$HYDRACACHE_CAMPAIGN" =~ ^hc0671-[a-z0-9][a-z0-9-]{5,55}:qualification$ ]]
          fi

      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Install pinned Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Verify trusted qualification context
        run: cargo run -p xtask --locked -- perf-qualification --release 0.67.1 --profile reference-v1 --phase context

      - name: Clear only prior performance evidence scratch
        shell: bash
        run: |
          rm -rf -- \
            target/test-evidence/0.67 \
            target/test-evidence/0.67.1 \
            target/release-evidence/receipts

      - name: Prepare tmpfs reference evidence
        run: scripts/perf/reference-evidence-tmpfs.sh prepare

      - name: Import frozen campaign host admission
        run: scripts/perf/import-reference-campaign-admission.sh

      - name: Import offline runner provisioning proof
        run: cargo run -p xtask --locked -- evidence-run --release 0.67.1 --gate tool.perf-runner-provisioned-0671

      - name: Build pinned redis-benchmark 7.2.5
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/hydracache-perf-tools"
          mkdir --parents "$tools_dir"
          cd "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 \
            --output redis-7.2.5.tar.gz \
            https://download.redis.io/releases/redis-7.2.5.tar.gz
          printf '%s  redis-7.2.5.tar.gz\n' '5981179706f8391f03be91d951acafaeda91af7fac56beffb2701963103e423d' \
            | sha256sum --check --strict -
          rm -rf -- redis-7.2.5
          tar --extract --gzip --file redis-7.2.5.tar.gz
          env -i PATH=/usr/bin:/bin HOME=/tmp CC=gcc MALLOC=libc BUILD_TLS=no \
            make -C redis-7.2.5 -j1 redis-benchmark
          test "$(redis-7.2.5/src/redis-benchmark --version)" = "redis-benchmark 7.2.5"
          echo "$tools_dir/redis-7.2.5/src" >> "$GITHUB_PATH"

      - name: Attest and preflight the 0.67.1 host
        run: cargo run -p xtask --locked -- evidence-run --release 0.67.1 --gate tool.perf-attestation-v5-0671

      - name: Prebuild exact 0.67 performance binaries
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate tool.perf-prebuild-067

      - name: Run bounded non-ship diagnostics
        run: |
          scripts/perf/run-reference-measurement.sh qualification-local
          scripts/perf/run-reference-measurement.sh qualification-client-surface

      - name: Materialize tmpfs reference evidence
        if: always()
        run: scripts/perf/reference-evidence-tmpfs.sh materialize

      - name: Run 0.67.1 qualification gate
        run: cargo run -p xtask --locked -- evidence-run --release 0.67.1 --gate tool.perf-qualification-0671

      - name: Upload 0.67.1 qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "performance-0671-qualification-${{ github.sha }}-${{ github.run_id }}"
          path: |
            target/test-evidence/0.67/**
            target/test-evidence/0.67.1/**
            target/release-evidence/receipts/**
          if-no-files-found: warn

  release-0671-performance-full-dress:
    name: 0.67.1 Full-Dress Bootstrap Admission
    runs-on: [self-hosted, linux, x64, hydracache-perf-v1]
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.performance_0671_mode == 'full-dress' && inputs.candidate_release == '0.67.1'
    concurrency:
      group: release-067-performance-reference-v1
      cancel-in-progress: false
    env:
      HYDRACACHE_RUN_PERF_REFERENCE: 1
      HYDRACACHE_PERF_RUNNER_CLASS: self-hosted-bare-metal-v1
      HYDRACACHE_PERFORMANCE_0671_MODE: full-dress

    steps:
      - name: Validate optional campaign correlation
        shell: bash
        env:
          HYDRACACHE_CAMPAIGN: ${{ inputs.performance_0671_campaign }}
        run: |
          if [[ -n "$HYDRACACHE_CAMPAIGN" ]]; then
            [[ "$HYDRACACHE_CAMPAIGN" =~ ^hc0671-[a-z0-9][a-z0-9-]{5,55}:full-dress-[12]$ ]]
          fi

      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Install pinned Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Verify trusted full-dress context
        run: cargo run -p xtask --locked -- perf-full-dress --release 0.67.1 --profile reference-v1 --phase context

      - name: Validate full-dress dispatch inputs
        shell: bash
        run: |
          predecessor='${{ inputs.full_dress_predecessor_run_id }}'
          if [[ -n "$predecessor" && ! "$predecessor" =~ ^[1-9][0-9]*$ ]]; then
            echo 'full_dress_predecessor_run_id must be empty or a positive integer' >&2
            exit 1
          fi

      - name: Download prior full-dress receipt
        if: inputs.full_dress_predecessor_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: performance-0671-full-dress-receipt
          path: ${{ runner.temp }}/hydracache-full-dress-predecessor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.full_dress_predecessor_run_id }}

      - name: Resolve prior full-dress receipt
        if: inputs.full_dress_predecessor_run_id != ''
        shell: bash
        run: |
          mapfile -t receipts < <(find "$RUNNER_TEMP/hydracache-full-dress-predecessor" \
            -type f -name full-dress-receipt.json -print)
          test "${#receipts[@]}" -eq 1
          echo "HYDRACACHE_FULL_DRESS_PREDECESSOR=${receipts[0]}" >> "$GITHUB_ENV"

      - name: Clear only prior performance evidence scratch
        shell: bash
        run: |
          rm -rf -- \
            target/test-evidence/0.67 \
            target/test-evidence/0.67.1 \
            target/release-evidence/receipts

      - name: Prepare tmpfs reference evidence
        run: scripts/perf/reference-evidence-tmpfs.sh prepare

      - name: Import frozen campaign host admission
        run: scripts/perf/import-reference-campaign-admission.sh

      - name: Import offline runner provisioning proof
        run: cargo run -p xtask --locked -- evidence-run --release 0.67.1 --gate tool.perf-runner-provisioned-0671

      - name: Build pinned redis-benchmark 7.2.5
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/hydracache-perf-tools"
          mkdir --parents "$tools_dir"
          cd "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 \
            --output redis-7.2.5.tar.gz \
            https://download.redis.io/releases/redis-7.2.5.tar.gz
          printf '%s  redis-7.2.5.tar.gz\n' '5981179706f8391f03be91d951acafaeda91af7fac56beffb2701963103e423d' \
            | sha256sum --check --strict -
          rm -rf -- redis-7.2.5
          tar --extract --gzip --file redis-7.2.5.tar.gz
          env -i PATH=/usr/bin:/bin HOME=/tmp CC=gcc MALLOC=libc BUILD_TLS=no \
            make -C redis-7.2.5 -j1 redis-benchmark
          test "$(redis-7.2.5/src/redis-benchmark --version)" = "redis-benchmark 7.2.5"
          echo "$tools_dir/redis-7.2.5/src" >> "$GITHUB_PATH"

      - name: Attest and preflight the 0.67.1 host
        run: cargo run -p xtask --locked -- evidence-run --release 0.67.1 --gate tool.perf-attestation-v5-0671

      - name: Prebuild exact 0.67 performance binaries
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate tool.perf-prebuild-067

      # Run the comparatively short control-plane family first. It has no
      # dependency on the core or Redis evidence and failing fast avoids
      # spending roughly two hours before surfacing a membership defect.
      - name: Run full-dress control-plane reference evidence
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate env.hydracache-run-067-perf-control-plane

      - name: Run full-dress core reference evidence
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate env.hydracache-run-067-perf-core

      - name: Start isolated rootless Docker for full-dress Redis comparison
        run: scripts/perf/rootless-docker.sh start

      - name: Run full-dress RESP reference evidence
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate env.hydracache-run-067-perf-resp

      - name: Stop isolated rootless Docker after full-dress Redis comparison
        if: always()
        run: scripts/perf/rootless-docker.sh stop

      - name: Materialize tmpfs reference evidence
        if: always()
        run: scripts/perf/reference-evidence-tmpfs.sh materialize

      - name: Retain non-promotable full-dress receipt
        run: cargo run -p xtask --locked -- perf-full-dress --release 0.67.1 --profile reference-v1 --phase receipt

      - name: Admit bootstrap after the second identical full-dress run
        if: inputs.full_dress_predecessor_run_id != ''
        run: cargo run -p xtask --locked -- perf-full-dress --release 0.67.1 --profile reference-v1 --phase admission --predecessor-receipt "$HYDRACACHE_FULL_DRESS_PREDECESSOR"

      - name: Upload reusable full-dress receipt
        uses: actions/upload-artifact@v6
        with:
          name: performance-0671-full-dress-receipt
          path: target/test-evidence/0.67.1/full-dress-receipt.json
          if-no-files-found: error

      - name: Upload two-run full-dress admission
        if: inputs.full_dress_predecessor_run_id != ''
        uses: actions/upload-artifact@v6
        with:
          name: performance-0671-full-dress-admission
          path: target/test-evidence/0.67.1/full-dress-admission.json
          if-no-files-found: error

      - name: Upload full-dress diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "performance-0671-full-dress-${{ github.sha }}-${{ github.run_id }}"
          path: |
            target/test-evidence/0.67/**
            target/test-evidence/0.67.1/**
            target/release-evidence/receipts/**
          if-no-files-found: warn

  release-0671-performance-bootstrap:
    name: 0.67.1 Bootstrap Sample Acquisition
    runs-on: [self-hosted, linux, x64, hydracache-perf-v1]
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.performance_0671_mode == 'bootstrap' && inputs.candidate_release == '0.67.1'
    concurrency:
      group: release-067-performance-reference-v1
      cancel-in-progress: false
    env:
      HYDRACACHE_RUN_PERF_REFERENCE: 1
      HYDRACACHE_PERF_RUNNER_CLASS: self-hosted-bare-metal-v1
      HYDRACACHE_PERFORMANCE_0671_MODE: bootstrap

    steps:
      - name: Validate optional campaign correlation
        shell: bash
        env:
          HYDRACACHE_CAMPAIGN: ${{ inputs.performance_0671_campaign }}
        run: |
          if [[ -n "$HYDRACACHE_CAMPAIGN" ]]; then
            [[ "$HYDRACACHE_CAMPAIGN" =~ ^hc0671-[a-z0-9][a-z0-9-]{5,55}:bootstrap-[1-5]$ ]]
            test "${HYDRACACHE_CAMPAIGN##*-}" = '${{ inputs.bootstrap_sample_index }}'
          fi

      - name: Checkout trusted main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Install pinned Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Verify trusted bootstrap context
        run: cargo run -p xtask --locked -- perf-bootstrap --release 0.67.1 --profile reference-v1 --phase context

      - name: Validate serialized bootstrap dispatch inputs
        shell: bash
        run: |
          sample_index='${{ inputs.bootstrap_sample_index }}'
          admission_run='${{ inputs.full_dress_admission_run_id }}'
          predecessor_run='${{ inputs.bootstrap_predecessor_run_id }}'
          [[ "$sample_index" =~ ^[1-5]$ ]]
          [[ "$admission_run" =~ ^[1-9][0-9]*$ ]]
          if [[ "$sample_index" = 1 ]]; then
            test -z "$predecessor_run"
          else
            [[ "$predecessor_run" =~ ^[1-9][0-9]*$ ]]
          fi

      - name: Download two-run full-dress admission
        uses: actions/download-artifact@v8
        with:
          name: performance-0671-full-dress-admission
          path: ${{ runner.temp }}/hydracache-full-dress-admission
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.full_dress_admission_run_id }}

      - name: Download immediately prior bootstrap receipt
        if: inputs.bootstrap_sample_index != '1'
        uses: actions/download-artifact@v8
        with:
          name: performance-0671-bootstrap-receipt
          path: ${{ runner.temp }}/hydracache-bootstrap-predecessor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.bootstrap_predecessor_run_id }}

      - name: Resolve bootstrap admission and predecessor
        shell: bash
        run: |
          mapfile -t admissions < <(find "$RUNNER_TEMP/hydracache-full-dress-admission" \
            -type f -name full-dress-admission.json -print)
          test "${#admissions[@]}" -eq 1
          echo "HYDRACACHE_FULL_DRESS_ADMISSION=${admissions[0]}" >> "$GITHUB_ENV"
          if [[ '${{ inputs.bootstrap_sample_index }}' != 1 ]]; then
            mapfile -t predecessors < <(find "$RUNNER_TEMP/hydracache-bootstrap-predecessor" \
              -type f -name bootstrap-sample.json -print)
            test "${#predecessors[@]}" -eq 1
            echo "HYDRACACHE_BOOTSTRAP_PREDECESSOR=${predecessors[0]}" >> "$GITHUB_ENV"
          fi

      - name: Clear only prior performance evidence scratch
        shell: bash
        run: |
          rm -rf -- \
            target/test-evidence/0.67 \
            target/test-evidence/0.67.1 \
            target/release-evidence/receipts

      - name: Prepare tmpfs reference evidence
        run: scripts/perf/reference-evidence-tmpfs.sh prepare

      - name: Import frozen campaign host admission
        run: scripts/perf/import-reference-campaign-admission.sh

      - name: Import offline runner provisioning proof
        run: cargo run -p xtask --locked -- evidence-run --release 0.67.1 --gate tool.perf-runner-provisioned-0671

      - name: Build pinned redis-benchmark 7.2.5
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/hydracache-perf-tools"
          mkdir --parents "$tools_dir"
          cd "$tools_dir"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 \
            --output redis-7.2.5.tar.gz \
            https://download.redis.io/releases/redis-7.2.5.tar.gz
          printf '%s  redis-7.2.5.tar.gz\n' '5981179706f8391f03be91d951acafaeda91af7fac56beffb2701963103e423d' \
            | sha256sum --check --strict -
          rm -rf -- redis-7.2.5
          tar --extract --gzip --file redis-7.2.5.tar.gz
          env -i PATH=/usr/bin:/bin HOME=/tmp CC=gcc MALLOC=libc BUILD_TLS=no \
            make -C redis-7.2.5 -j1 redis-benchmark
          test "$(redis-7.2.5/src/redis-benchmark --version)" = "redis-benchmark 7.2.5"
          echo "$tools_dir/redis-7.2.5/src" >> "$GITHUB_PATH"

      - name: Attest and preflight the 0.67.1 host
        run: cargo run -p xtask --locked -- evidence-run --release 0.67.1 --gate tool.perf-attestation-v5-0671

      - name: Prebuild exact 0.67 performance binaries
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate tool.perf-prebuild-067

      - name: Authorize exact serialized bootstrap sample before measurement
        shell: bash
        run: |
          args=(
            --release 0.67.1
            --profile reference-v1
            --phase authorize
            --sample-index '${{ inputs.bootstrap_sample_index }}'
            --admission "$HYDRACACHE_FULL_DRESS_ADMISSION"
          )
          if [[ -n "${HYDRACACHE_BOOTSTRAP_PREDECESSOR:-}" ]]; then
            args+=(--predecessor "$HYDRACACHE_BOOTSTRAP_PREDECESSOR")
          fi
          cargo run -p xtask --locked -- perf-bootstrap "${args[@]}"

      - name: Run bootstrap control-plane reference evidence
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate env.hydracache-run-067-perf-control-plane

      - name: Run bootstrap core reference evidence
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate env.hydracache-run-067-perf-core

      - name: Start isolated rootless Docker for Redis comparison
        run: scripts/perf/rootless-docker.sh start

      - name: Run bootstrap RESP reference evidence
        run: cargo run -p xtask --locked -- evidence-run --release 0.67 --gate env.hydracache-run-067-perf-resp

      - name: Stop isolated rootless Docker after Redis comparison
        if: always()
        run: scripts/perf/rootless-docker.sh stop

      - name: Materialize tmpfs reference evidence
        if: always()
        run: scripts/perf/reference-evidence-tmpfs.sh materialize

      - name: Retain non-ship bootstrap sample
        shell: bash
        run: |
          args=(
            --release 0.67.1
            --profile reference-v1
            --phase sample
            --sample-index '${{ inputs.bootstrap_sample_index }}'
            --admission "$HYDRACACHE_FULL_DRESS_ADMISSION"
          )
          if [[ -n "${HYDRACACHE_BOOTSTRAP_PREDECESSOR:-}" ]]; then
            args+=(--predecessor "$HYDRACACHE_BOOTSTRAP_PREDECESSOR")
          fi
          cargo run -p xtask --locked -- perf-bootstrap "${args[@]}"

      - name: Upload reusable bootstrap receipt
        uses: actions/upload-artifact@v6
        with:
          name: performance-0671-bootstrap-receipt
          path: target/test-evidence/0.67.1/bootstrap-sample.json
          if-no-files-found: error

      - name: Upload 0.67.1 bootstrap sample
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "performance-0671-bootstrap-${{ github.sha }}-${{ github.run_id }}"
          path: |
            target/test-evidence/0.67/**
            target/test-evidence/0.67.1/**
            target/release-evidence/receipts/**
          if-no-files-found: warn

