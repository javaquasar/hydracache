name: CI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('CI dispatch {0}', inputs.performance_0671_campaign || inputs.performance_0671_mode)
      || '' }}

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      run_nightly:
        description: "Run scheduled/nightly proof lanes during manual dispatch"
        required: false
        default: false
        type: boolean
      run_reference_performance:
        description: "Run 0.67 ship evidence on the authorized self-hosted bare-metal runner"
        required: false
        default: false
        type: boolean
      run_memory_diagnostic:
        description: "Run non-promotable HydraCache/Redis memory diagnostics on a GitHub-hosted VM"
        required: false
        default: false
        type: boolean
      run_retention_soak_070:
        description: "Run the release 0.70 100-cycle and million-mutation retention proofs"
        required: false
        default: false
        type: boolean
      run_release_070_admission:
        description: "Require exact-SHA fast, canary and retention receipts for release 0.70"
        required: false
        default: false
        type: boolean
      memory_diagnostic_duration_seconds:
        description: "Per-case memory diagnostic observation window"
        required: true
        default: "180"
        type: choice
        options:
          - "120"
          - "180"
          - "300"
      performance_0671_mode:
        description: "Explicit 0.67.1 dedicated-runner stage (qualification is never ship evidence)"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "qualify"
          - "full-dress"
          - "bootstrap"
          - "frozen-candidate"
      performance_0671_campaign:
        description: "Optional controller correlation in the exact form campaign-id:unique-step"
        required: false
        default: ""
        type: string
      full_dress_predecessor_run_id:
        description: "Prior successful full-dress run id; empty for the first of exactly two runs"
        required: false
        default: ""
        type: string
      full_dress_admission_run_id:
        description: "Run id that published the two-run full-dress admission required by bootstrap"
        required: false
        default: ""
        type: string
      bootstrap_sample_index:
        description: "Serialized bootstrap sample index; samples 2..5 require the immediately prior run"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      bootstrap_predecessor_run_id:
        description: "Immediately prior accepted bootstrap run id; empty only for sample 1"
        required: false
        default: ""
        type: string
      candidate_release:
        description: "Release that owns candidate fast and manually dispatched gate receipts"
        required: false
        default: "0.69"
        type: string
      gated_gate_id:
        description: "Exact gate id from docs/testing/gated-test-registry.toml"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'core' }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read
  actions: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  HYDRACACHE_CANDIDATE_RELEASE: ${{ inputs.candidate_release || '0.69' }}
  HYDRACACHE_EVIDENCE_ROOT: target/release-evidence
  HYDRACACHE_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  HYDRACACHE_EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  HYDRACACHE_EVIDENCE_TESTED_SHA: ${{ github.sha }}

jobs:
  ci-topology:
    name: 0.71 CI topology safety gate
    if: github.event_name != 'workflow_dispatch' || inputs.performance_0671_mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate topology through fail-closed watchdog
        run: >-
          python3 scripts/ci/run-with-heartbeat.py
          --timeout-seconds 600
          --heartbeat-seconds 30
          --attempt-id "${{ github.run_attempt }}"
          --status-json target/ci-topology/watchdog-status.json
          --log-file target/ci-topology/command.log
          --
          cargo run -p xtask --locked -- ci-topology-check --release 0.71

      - name: Retain topology watchdog attempt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "ci-topology-071-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: target/ci-topology/**
          if-no-files-found: error
          retention-days: 30

  memory-contracts-071:
    name: 0.71 Memory Contracts
    if: github.event_name != 'workflow_dispatch' || inputs.performance_0671_mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate and close the ownership inventory
        run: |
          cargo run -p xtask --locked -- memory-owner-inventory --release 0.71
          cargo run -p xtask --locked -- memory-ownership-check --release 0.71

      - name: Validate decision, statistics, allocator, compatibility, and release contracts
        run: |
          cargo run -p xtask --locked -- memory-decision-check --release 0.71
          cargo run -p xtask --locked -- memory-statistics-check --release 0.71
          cargo run -p xtask --locked -- allocator-capability-check --release 0.71
          cargo run -p xtask --locked -- memory-compat-check --release 0.71
          cargo run -p xtask --locked -- memory-release-policy-check --release 0.71

      - name: Run 0.71 contract canaries
        run: |
          cargo test -p xtask --test memory_ownership_071 --locked
          cargo test -p xtask --test memory_contracts_071 --locked
          cargo test -p xtask --test memory_statistics_071 --locked
          cargo test -p xtask --test memory_profile_071 --locked
          cargo test -p xtask --test memory_baseline_071 --locked
          cargo run -p xtask --locked -- memory-baseline-check --release 0.71

      - name: Verify coherent snapshots and phase providers
        run: |
          cargo test -p hydracache --test memory_footprint_071 --locked
          cargo test -p hydracache --test memory_accounting_071 --locked -- --test-threads=1
          cargo test -p hydracache memory_footprint::tests --locked
          cargo test -p hydracache-loadgen memory_efficiency --locked
          python scripts/perf/memory-providers/test_provider_contract.py
          python scripts/perf/memory_campaign_071_test.py
          python scripts/perf/memory_case_executor_071_test.py
          python scripts/perf/memory_historical_mirror_071_test.py
          for mode in off production profile; do
            cargo run -p hydracache-loadgen --bin hydracache-loadgen --locked -- memory-efficiency --provider system --instrumentation-mode "$mode" --output-dir "target/memory-evidence/0.71/profiles/ci-smoke/$mode"
          done

      - name: Prove bounded campaign resume and finalization
        run: |
          python scripts/perf/memory_campaign_071.py plan --campaign-id ci-bounded-${{ github.run_id }}-${{ github.run_attempt }} --case M0-cold --repetitions 1 --rehearsal
          python scripts/perf/memory_campaign_071.py run --campaign-id ci-bounded-${{ github.run_id }}-${{ github.run_attempt }}
          python scripts/perf/memory_campaign_071.py resume --campaign-id ci-bounded-${{ github.run_id }}-${{ github.run_attempt }}
          python scripts/perf/memory_campaign_071.py finalize --campaign-id ci-bounded-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retain ownership inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "memory-ownership-071-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            target/memory-evidence/0.71/ownership-inventory.json
            target/memory-evidence/0.71/profiles/ci-smoke/**
            target/memory-evidence/0.71/campaigns/ci-bounded-*/**
          if-no-files-found: error
          retention-days: 30

  release-071-ci-admission:
    name: Release 0.71 CI Admission
    if: always() && startsWith(github.ref, 'refs/tags/v0.71.')
    needs:
      - ci-topology
      - memory-contracts-071
      - memory-regression-fast
      - docs
      - rust
      - msrv
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require the designated exact-tag core result
        env:
          TOPOLOGY_RESULT: ${{ needs.ci-topology.result }}
          CONTRACTS_RESULT: ${{ needs.memory-contracts-071.result }}
          MEMORY_RESULT: ${{ needs.memory-regression-fast.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$TOPOLOGY_RESULT" "$CONTRACTS_RESULT" "$MEMORY_RESULT" "$DOCS_RESULT" "$RUST_RESULT" "$MSRV_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Release 0.71 core admission refused result=$result" >&2
              exit 1
            fi
          done
          echo "Release 0.71 designated tag admission is green for $GITHUB_SHA."

  memory-regression-fast:
    name: Memory Regression Fast
    if: github.event_name != 'workflow_dispatch' || inputs.performance_0671_mode == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-memory-regression-fast
          cache-targets: true

      - name: Prove behavioral memory canaries are red
        run: |
          cargo run -p xtask --locked -- canary-check --release 0.70
          cargo run -p xtask --locked -- canary-sweep --release 0.70 --tier fast

      - name: Run exact-candidate memory regression evidence
        id: memory_fast
        run: cargo run -p xtask --locked -- evidence-run --release 0.70 --gate fast.memory-regression-070

      - name: Finalize memory regression lane status
        if: always()
        run: >-
          cargo run -p xtask --locked -- ci-admission-status
          --release 0.70
          --source "$HYDRACACHE_EVIDENCE_TESTED_SHA"
          --head "$HYDRACACHE_EVIDENCE_HEAD_SHA"
          --base "$HYDRACACHE_EVIDENCE_BASE_SHA"
          --require "memory-fast=${{ steps.memory_fast.outcome }}"
          --output target/release-evidence/lanes/memory-fast-070.json

      - name: Upload exact-candidate memory evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "memory-regression-fast-070-${{ github.sha }}"
          path: |
            target/release-evidence/canaries/*.json
            target/release-evidence/lanes/memory-fast-070.json
            target/release-evidence/receipts/**
          if-no-files-found: error

  memory-diagnostic-hosted:
    name: Memory Diagnostic (GitHub Hosted)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_memory_diagnostic)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      LEAK_DURATION_SECONDS: ${{ inputs.memory_diagnostic_duration_seconds || '120' }}
      LEAK_CYCLES: 3
      LEAK_BATCH_REQUESTS: 10000
      MEASUREMENT_AFFINITY: 0
      MEMORY_DIAGNOSTIC_ENVIRONMENT: github-hosted
      MEMORY_DIAGNOSTIC_TARGETS: hydra redis
      REDIS_IMAGE: redis@sha256:3aaec283e6e593bde528077d60280ac1589887067a39273348860837c9346d7e
      MEMORY_DIAGNOSTIC_OUTPUT: target/memory-diagnostic/github-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-memory-diagnostic-hosted
          cache-targets: false

      - name: Install diagnostic tools
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential jq netcat-openbsd redis-tools

      - name: Build release daemon
        run: cargo build --release -p hydracache-server --locked

      - name: Build pinned redis-benchmark 7.2.5
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/memory-diagnostic-tools"
          mkdir --parents "$tools_dir"
          cd "$tools_dir"
          curl --fail --location --retry 3 \
            --output redis-7.2.5.tar.gz \
            https://download.redis.io/releases/redis-7.2.5.tar.gz
          printf '%s  redis-7.2.5.tar.gz\n' \
            '5981179706f8391f03be91d951acafaeda91af7fac56beffb2701963103e423d' \
            | sha256sum --check --strict
          tar --extract --gzip --file redis-7.2.5.tar.gz
          make -C redis-7.2.5 -j1 redis-benchmark
          test "$(redis-7.2.5/src/redis-benchmark --version)" = "redis-benchmark 7.2.5"
          echo "REDIS_BENCHMARK=$tools_dir/redis-7.2.5/src/redis-benchmark" >> "$GITHUB_ENV"

      - name: Pull pinned Redis image
        run: |
          docker pull "$REDIS_IMAGE"
          docker image inspect "$REDIS_IMAGE" > target/redis-image-inspect.json

      - name: Run HydraCache and Redis memory campaign
        shell: bash
        run: scripts/perf/run-memory-leak-stage.sh "$MEMORY_DIAGNOSTIC_OUTPUT"

      - name: Publish report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$MEMORY_DIAGNOSTIC_OUTPUT/report.md" ]]; then
            cat "$MEMORY_DIAGNOSTIC_OUTPUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build compact diagnostic summary and non-gating trend
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          summary_dir="target/memory-summary"
          mkdir --parents "$summary_dir"
          python3 scripts/perf/summarize-memory-diagnostic.py \
            --input "$MEMORY_DIAGNOSTIC_OUTPUT" \
            --output "$summary_dir/summary.json"
          baseline_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("memory-summary-"))) | [.created_at, .id] | @tsv' \
            | sort --reverse | head -n 1 | cut -f 2)"
          if [[ -n "$baseline_id" ]]; then
            baseline_dir="$RUNNER_TEMP/memory-summary-baseline"
            mkdir --parents "$baseline_dir"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$baseline_id/zip" > "$baseline_dir/artifact.zip"
            unzip -q "$baseline_dir/artifact.zip" -d "$baseline_dir"
            baseline_summary="$(find "$baseline_dir" -name summary.json -type f -print -quit)"
            python3 scripts/perf/compare-memory-summaries.py \
              --baseline "$baseline_summary" \
              --candidate "$summary_dir/summary.json" \
              --output "$summary_dir/trend.json"
          else
            python3 scripts/perf/compare-memory-summaries.py \
              --candidate "$summary_dir/summary.json" \
              --output "$summary_dir/trend.json"
          fi

      - name: Upload raw memory evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: memory-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/memory-diagnostic/github-hosted
            target/redis-image-inspect.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload durable compact memory history
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: memory-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/memory-summary
          if-no-files-found: error
          retention-days: 90

  retention-soak-070:
    name: Retention Soak 0.70
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v0.70.') || (github.event_name == 'workflow_dispatch' && (inputs.run_retention_soak_070 || inputs.run_release_070_admission))
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-retention-soak-070
          cache-targets: true

      - name: Run 100-cycle core retention soak
        timeout-minutes: 20
        id: core_soak
        run: cargo run -p xtask --locked -- evidence-run --release 0.70 --gate tool.hydracache.retention-soak-070

      - name: Run million-mutation client-surface retention soak
        timeout-minutes: 30
        id: client_soak
        run: cargo run -p xtask --locked -- evidence-run --release 0.70 --gate tool.hydracache-client-transport-axum.retention-soak-070

      - name: Finalize retention soak lane status
        timeout-minutes: 5
        if: always()
        run: >-
          cargo run -p xtask --locked -- ci-admission-status
          --release 0.70
          --source "$HYDRACACHE_EVIDENCE_TESTED_SHA"
          --head "$HYDRACACHE_EVIDENCE_HEAD_SHA"
          --base "$HYDRACACHE_EVIDENCE_BASE_SHA"
          --require "core-soak=${{ steps.core_soak.outcome }}"
          --require "client-soak=${{ steps.client_soak.outcome }}"
          --output target/release-evidence/lanes/retention-soak-070.json

      - name: Upload exact-candidate retention evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "retention-soak-070-${{ github.sha }}"
          path: |
            target/release-evidence/lanes/retention-soak-070.json
            target/release-evidence/receipts/**
          if-no-files-found: error

  release-070-admission:
    name: Release 0.70 Admission
    if: always() && (startsWith(github.ref, 'refs/tags/v0.70.') || (github.event_name == 'workflow_dispatch' && inputs.run_release_070_admission))
    needs:
      - memory-regression-fast
      - retention-soak-070
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact tested candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Materialize fail-loud upstream admission status
        run: >-
          cargo run -p xtask --locked -- ci-admission-status
          --release 0.70
          --source "$HYDRACACHE_EVIDENCE_TESTED_SHA"
          --head "$HYDRACACHE_EVIDENCE_HEAD_SHA"
          --base "$HYDRACACHE_EVIDENCE_BASE_SHA"
          --require "memory-fast=${{ needs.memory-regression-fast.result }}"
          --require "retention-soak=${{ needs.retention-soak-070.result }}"
          --output target/release-evidence/0.70.admission-upstream.json

      - name: Download exact-candidate memory receipts and canaries
        uses: actions/download-artifact@v8
        with:
          name: "memory-regression-fast-070-${{ github.sha }}"
          path: target/release-evidence

      - name: Download exact-candidate retention receipts
        uses: actions/download-artifact@v8
        with:
          name: "retention-soak-070-${{ github.sha }}"
          path: target/release-evidence

      - name: Validate exact-candidate lane status artifacts
        run: >-
          cargo run -p xtask --locked -- ci-admission-status
          --release 0.70
          --source "$HYDRACACHE_EVIDENCE_TESTED_SHA"
          --head "$HYDRACACHE_EVIDENCE_HEAD_SHA"
          --base "$HYDRACACHE_EVIDENCE_BASE_SHA"
          --lane-status "memory-fast=target/release-evidence/lanes/memory-fast-070.json"
          --lane-status "retention-soak=target/release-evidence/lanes/retention-soak-070.json"
          --output target/release-evidence/0.70.admission-lanes.json

      - name: Require exact-candidate release 0.70 evidence
        run: cargo run -p xtask --locked -- release-evidence --release 0.70 --receipts-dir target/release-evidence/receipts --require-ship

      - name: Upload release 0.70 admission
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "release-070-admission-${{ github.sha }}"
          path: target/release-evidence/0.70.*
          if-no-files-found: error

  docs:
    name: Docs
    if: github.event_name != 'workflow_dispatch' || inputs.performance_0671_mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-docs-ci
          cache-targets: true

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2

      - name: Check docs examples formatting
        run: cargo fmt --manifest-path docs-site/examples/Cargo.toml --check

      - name: Check docs examples
        run: cargo check --manifest-path docs-site/examples/Cargo.toml --all-targets --locked

      - name: Build docs site
        run: mdbook build docs-site

      - name: Check documentation links
        run: node scripts/docs-link-check.mjs

  rust:
    name: Rust
    if: github.event_name != 'workflow_dispatch' || inputs.performance_0671_mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Java for HC/2 generated-language proof
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Python for HC/2 offline generated-language proof
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust-with-target
          cache-targets: true

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: HC/2 generated Rust, Java, and offline Python proof
        env:
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: cargo run -p xtask --locked -- client-plane-spike-check

      - name: Dependency bans
        run: cargo deny check bans

      - name: Docs consistency
        run: |
          cargo test -p xtask --test doc_check --locked
          cargo run -p xtask --locked -- doc-check

      - name: Raft mutation baseline
        run: |
          cargo test -p xtask --test mutants --locked
          cargo run -p xtask --locked -- mutants

      - name: Canary completeness
        run: |
          cargo test -p xtask --test canary_check --locked
          cargo run -p xtask --locked -- canary-check --release 0.64
          cargo run -p xtask --locked -- canary-sweep --release 0.64 --tier fast
          cargo run -p xtask --locked -- canary-check --release 0.65
          cargo run -p xtask --locked -- canary-sweep --release 0.65 --tier fast
          cargo run -p xtask --locked -- canary-check --release 0.66
          cargo run -p xtask --locked -- canary-sweep --release 0.66 --tier fast
          cargo run -p xtask --locked -- canary-check --release 0.67
