  migration-conformance-postgres-069:
    name: Migration Conformance PostgreSQL 0.69 (${{ matrix.postgres.series }})
    if: github.event_name != 'workflow_dispatch' || inputs.performance_0671_mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - series: "16"
            image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
            happy_gate: ignored.hydracache-db.cached-vs-direct-postgres-069
            run_canary_and_soak: true
          - series: "18"
            image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
            happy_gate: ignored.hydracache-db.cached-vs-direct-postgres-18-069
            run_canary_and_soak: false
    env:
      HYDRACACHE_TEST_POSTGRES_URL: postgres://hydracache:hydracache@127.0.0.1:5432/hydracache
      HYDRACACHE_POSTGRES_SERIES: ${{ matrix.postgres.series }}
      HYDRACACHE_POSTGRES_IMAGE_ID: ${{ matrix.postgres.image }}
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_DB: hydracache
          POSTGRES_PASSWORD: hydracache
          POSTGRES_USER: hydracache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydracache -d hydracache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-migration-conformance-postgres-${{ matrix.postgres.series }}-069
          cache-targets: true

      - name: Run PostgreSQL cached-vs-direct differential
        id: postgres_happy
        run: cargo run -p xtask --locked -- evidence-run --release 0.69 --gate "${{ matrix.postgres.happy_gate }}"

      - name: Prove PostgreSQL dropped-invalidation canary is red
        id: postgres_canary
        if: matrix.postgres.run_canary_and_soak
        run: cargo run -p xtask --locked -- evidence-run --release 0.69 --gate ignored.hydracache-db.cached-vs-direct-postgres-canary-069

      - name: Run bounded PostgreSQL commit-wait soak
        timeout-minutes: 20
        id: postgres_soak
        if: matrix.postgres.run_canary_and_soak
        run: cargo run -p xtask --locked -- evidence-run --release 0.69 --gate ignored.hydracache-db.cached-vs-direct-postgres-soak-069

      - name: Finalize PostgreSQL 16 evidence lane status
        if: always() && matrix.postgres.run_canary_and_soak
        run: >-
          cargo run -p xtask --locked -- ci-admission-status
          --release 0.69
          --source "$HYDRACACHE_EVIDENCE_TESTED_SHA"
          --head "$HYDRACACHE_EVIDENCE_HEAD_SHA"
          --base "$HYDRACACHE_EVIDENCE_BASE_SHA"
          --require "postgres-happy=${{ steps.postgres_happy.outcome }}"
          --require "postgres-canary=${{ steps.postgres_canary.outcome }}"
          --require "postgres-soak=${{ steps.postgres_soak.outcome }}"
          --output target/release-evidence/lanes/postgres-16.json

      - name: Finalize PostgreSQL 18 evidence lane status
        if: always() && !matrix.postgres.run_canary_and_soak
        run: >-
          cargo run -p xtask --locked -- ci-admission-status
          --release 0.69
          --source "$HYDRACACHE_EVIDENCE_TESTED_SHA"
          --head "$HYDRACACHE_EVIDENCE_HEAD_SHA"
          --base "$HYDRACACHE_EVIDENCE_BASE_SHA"
          --require "postgres-happy=${{ steps.postgres_happy.outcome }}"
          --output target/release-evidence/lanes/postgres-18.json

      - name: Upload PostgreSQL conformance receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "migration-conformance-postgres-069-receipts-${{ matrix.postgres.series }}-${{ github.sha }}"
          path: |
            target/release-evidence/lanes/*.json
            target/release-evidence/receipts/**
            target/test-evidence/0.69/**
          if-no-files-found: error

      - name: Upload PostgreSQL conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "migration-conformance-postgres-069-${{ matrix.postgres.series }}-${{ github.sha }}"
          path: |
            target/test-evidence/0.69/**
            target/release-evidence/receipts/**
          if-no-files-found: error

