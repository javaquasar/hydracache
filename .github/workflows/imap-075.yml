name: IMap 0.75 local qualification
on:
  pull_request:
    paths: ['crates/**', 'sdks/java/**', 'tests/java-imap-benchmark/**', 'tests/java-imap-hazelcast-075/**', 'tests/rust-imap-contract-consumer-075/**', 'docs/testing/imap/**', 'fuzz/**', '.github/workflows/ci.yml', '.github/workflows/imap-075.yml', 'Cargo.toml', 'Cargo.lock']
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded local proof matrix
        type: choice
        options: [pr, nightly]
        default: pr
permissions:
  contents: read
concurrency:
  group: imap075-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      mode: ${{ steps.matrix.outputs.mode }}
    steps:
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import json, os
          mode = 'nightly' if os.environ['EVENT'] == 'schedule' or os.environ['INPUT_MODE'] == 'nightly' else 'pr'
          lanes = [{'rust': r, 'java': j, 'shard': s} for r in ['1.88.0', '1.94.0'] for j in [17, 21] for s in (range(4) if mode == 'nightly' else range(1))]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('matrix=' + json.dumps({'include': lanes}) + '\nmode=' + mode + '\n')
          PY
  qualification:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Qualification budget
        shell: bash
        run: echo "HYDRACACHE_IMAP075_BUILD_DEADLINE_MS=$(( ($(date +%s) + 43 * 60) * 1000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Exact Rust toolchain
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component clippy --component rustfmt
          rustup default '${{ matrix.rust }}'
      - name: Run bounded local proofs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/imap-075/ci
          cargo xtask imap-ci-run --release 0.75 --mode '${{ needs.plan.outputs.mode }}' --rust '${{ matrix.rust }}' --java '${{ matrix.java }}' --shard '${{ matrix.shard }}' --output 'target/imap-075/ci/ci-receipt-${{ matrix.rust }}-${{ matrix.java }}-${{ matrix.shard }}.json' 2>&1 | tee target/imap-075/ci/lane.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: imap075-receipt-${{ matrix.rust }}-${{ matrix.java }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: target/imap-075/ci/ci-receipt-*.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: imap075-diagnostics-${{ matrix.rust }}-${{ matrix.java }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/imap-075/ci/
            target/imap-075/builds/
            target/imap-075/differential-failures/
            target/imap-075/cluster-failures/
            tests/java-imap-benchmark/target/surefire-reports/
            tests/java-imap-benchmark/target/site/jacoco/
            tests/java-imap-hazelcast-075/target/surefire-reports/
            tests/java-imap-hazelcast-075/target/site/jacoco/
  complete:
    if: always()
    needs: [plan, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: imap075-receipt-*
          path: target/imap-075/collected
      - name: Verify every required lane
        env:
          LANES_RESULT: ${{ needs.qualification.result }}
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          cargo xtask imap-ci-check --release 0.75 --mode '${{ needs.plan.outputs.mode }}' --receipts target/imap-075/collected
          test "$LANES_RESULT" = success # needs.qualification.result must be success
