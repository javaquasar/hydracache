name: HC/2 Client Plane Evidence

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      run_hc2_fuzz:
        description: "Run the time-boxed HC/2 fuzz lane"
        required: false
        default: false
        type: boolean
      run_hc2_fixed_host_soak:
        description: "Run the HC/2 soak lane on the labelled fixed host"
        required: false
        default: false
        type: boolean
      run_hc2_release_admission:
        description: "Require all four same-SHA receipts and evaluate HC/2 release admission"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: "hc2-client-plane-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  HC2_RUST_TOOLCHAIN: "1.94.0"
  HC2_FUZZ_TOOLCHAIN: "nightly-2026-08-01"
  HC2_FUZZ_SEED: "220068"
  HC2_SOAK_ITERATIONS: "12"
  HC2_INTEROP_IMAGE: "ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  linux-required:
    name: HC/2 Linux Required
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
      - name: Install pinned Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate workflow and generation contract
        run: |
          cargo fmt --all -- --check
          cargo run -p xtask --locked -- client-plane-ci-check
      - name: Validate schema, languages, lifecycle, and retained replay
        env:
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: cargo run -p xtask --locked -- client-plane-spike-check
      - name: Clippy the HC/2 evidence surface
        run: cargo clippy -p hydracache-client-plane-spike -p hydracache-client-hc2 -p xtask --all-targets --locked -- -D warnings
      - name: Emit Linux receipt
        run: cargo run -p xtask --locked -- client-plane-ci-receipt --lane linux-required --output target/hc2-ci/linux-required.receipt.json
      - name: Upload Linux receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: "hc2-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: target/hc2-ci/*.receipt.json
          if-no-files-found: warn
          retention-days: 30

  docker-interop:
    name: HC/2 Docker Interop
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install pinned receipt toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.94.0"
      - name: Build digest-pinned interop environment
        run: docker build --pull --file scripts/hc2/Dockerfile.interop --tag hydracache-hc2-interop:${{ github.sha }} .
      - name: Run Rust, Java, and offline Python process interop in Docker
        run: |
          mkdir -p target/hc2-docker
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env CARGO_TARGET_DIR=/workspace/target/hc2-docker \
            --env HC2_SHARED_TARGET_DIR=target/hc2-docker \
            hydracache-hc2-interop:${{ github.sha }} \
            run -p xtask --locked -- client-plane-docker-interop-check 2>&1 | tee target/hc2-ci-docker.log
      - name: Emit Docker receipt
        run: cargo run -p xtask --locked -- client-plane-ci-receipt --lane docker-interop --image "$HC2_INTEROP_IMAGE" --output target/hc2-ci/docker-interop.receipt.json
      - name: Upload Docker receipt and log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: "hc2-docker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            target/hc2-ci/*.receipt.json
            target/hc2-ci-docker.log
          if-no-files-found: warn
          retention-days: 30

  fuzz:
    name: HC/2 Fuzz Scheduled
    if: >-
      github.event_name == 'schedule'
      || startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.run_hc2_fuzz)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned stable Rust for receipts
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.94.0"
      - name: Install pinned fuzz toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$HC2_FUZZ_TOOLCHAIN"
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run bounded HC/2 corpus fuzzing
        working-directory: fuzz
        run: cargo +"$HC2_FUZZ_TOOLCHAIN" fuzz run fuzz_hc2_client_plane -- -seed="$HC2_FUZZ_SEED" -max_total_time=180 2>&1 | tee ../target/hc2-ci-fuzz.log
      - name: Emit fuzz receipt
        run: cargo +"$HC2_RUST_TOOLCHAIN" run -p xtask --locked -- client-plane-ci-receipt --lane fuzz --seed "$HC2_FUZZ_SEED" --output target/hc2-ci/fuzz.receipt.json
      - name: Upload fuzz corpus, failures, log, and receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: "hc2-fuzz-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            fuzz/corpus/fuzz_hc2_client_plane/**
            fuzz/artifacts/fuzz_hc2_client_plane/**
            target/hc2-ci-fuzz.log
            target/hc2-ci/*.receipt.json
          if-no-files-found: warn
          retention-days: 30

  fixed-host-soak:
    name: HC/2 Fixed-host Soak
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'schedule' && vars.HC2_FIXED_HOST_SOAK_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.run_hc2_fixed_host_soak)
    runs-on: [self-hosted, linux, x64, hydracache-hc2-soak-v1]
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.94.0"
      - name: Capture fixed-host metadata
        run: |
          mkdir -p target/hc2-ci
          uname -a | tee target/hc2-ci/fixed-host-metadata.log
          lscpu | tee -a target/hc2-ci/fixed-host-metadata.log
          git rev-parse HEAD | tee -a target/hc2-ci/fixed-host-metadata.log
          rustc --version --verbose | tee -a target/hc2-ci/fixed-host-metadata.log
      - name: Run bounded lifecycle soak
        run: |
          set -o pipefail
          for iteration in $(seq 1 "$HC2_SOAK_ITERATIONS"); do
            echo "hc2-soak-iteration=$iteration"
            cargo test -p hydracache-client-plane-spike --locked --test grpc_bidirectional_loopback --test fault_proxy --test http2_drain_faults --test observability_contract
          done 2>&1 | tee target/hc2-ci/fixed-host-soak.log
      - name: Emit fixed-host receipt
        run: cargo run -p xtask --locked -- client-plane-ci-receipt --lane fixed-host-soak --iterations "$HC2_SOAK_ITERATIONS" --output target/hc2-ci/fixed-host-soak.receipt.json
      - name: Upload fixed-host metadata, log, and receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: "hc2-soak-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: target/hc2-ci/**
          if-no-files-found: warn
          retention-days: 30

  release-admission:
    name: HC/2 Release Admission
    if: >-
      always()
      && (startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.run_hc2_release_admission))
    needs: [linux-required, docker-interop, fuzz, fixed-host-soak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.94.0"
      - name: Download same-run HC/2 receipts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: "hc2-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: target/hc2-ci-admission
          merge-multiple: true
      - name: Refuse incomplete or red HC/2 claim
        run: cargo run -p xtask --locked -- client-plane-ci-admission --receipts target/hc2-ci-admission --commit "${{ github.sha }}"
