[workspace]

[package]
name = "resp-stage-profile-074"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
hydracache-client-protocol = { path = "../../crates/hydracache-client-protocol" }
hydracache-loadgen = { path = "../../crates/hydracache-loadgen" }
hydracache-redis-compat = { path = "../../crates/hydracache-redis-compat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
