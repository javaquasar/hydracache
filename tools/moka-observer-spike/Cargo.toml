[workspace]

[package]
name = "moka-observer-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
moka = { path = "../../target/moka-observer-spike/moka", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
