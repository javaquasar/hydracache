schema = "hc074-coordinator-frames-v1"
scope = "opt-in coordinator clock brackets; this stage model-only, no native control"
cli_flag = "--coordinator-frames"
phases = ["setup", "spawn", "wait", "terminal_reads", "decode", "close"]
max_probes = 12
max_clock_reads = 36
wall_clock = "time.monotonic_ns"
cpu_clock = "time.process_time_ns"
cpu_scope = "coordinator process-wide, all threads; not native Git CPU"
wall_bounds_scope = "elapsed between bracketed CPU-read instants, not effect-only duration"
bound_seconds = 120
cleanup_seconds = 5
blocks = 4
workers_per_block = 4
calls_per_worker = 4
free_bytes = 4294967296
log_bytes = 16777216
failure_policy = "freeze on first ordinary telemetry fault; finish original wait/cleanup; preserve operational refusal"
native_control_executed = false
overhead_accepted = false
pure_api_cost_proved = false
complete_frame_partition = false
existing_predicates_removed_or_reordered = false
window_renewed = false
package_pass = false
server_services_clocks = false
