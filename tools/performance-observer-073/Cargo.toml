[workspace]

[package]
name = "performance-observer-073"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
hydracache = { path = "../../crates/hydracache", features = ["instrumentation-lab"] }
hydracache-loadgen = { path = "../../crates/hydracache-loadgen" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
