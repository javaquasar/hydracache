[workspace]

[package]
name = "get-owner-scheduled-controls-074"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
get-owner = ["hydracache-redis-compat/experimental-resp-get-owner-074"]
allocation-diagnostics = []

[[bin]]
name = "memory-diagnostics-074"
path = "src/bin/memory_diagnostics.rs"
required-features = ["allocation-diagnostics"]

[[bin]]
name = "timing-controls-074"
path = "src/bin/timing_controls.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
hdrhistogram = "7"
hydracache = { path = "../../crates/hydracache" }
hydracache-client-hc2 = { path = "../../crates/hydracache-client-hc2" }
hydracache-client-protocol = { path = "../../crates/hydracache-client-protocol" }
hydracache-client-transport-axum = { path = "../../crates/hydracache-client-transport-axum" }
hydracache-redis-compat = { path = "../../crates/hydracache-redis-compat" }
hydracache-server = { path = "../../crates/hydracache-server" }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["test-util"] }
