[workspace]

[package]
name = "resp-pipeline-profile-074"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
hdrhistogram = "7"
hydracache-client-transport-axum = { path = "../../crates/hydracache-client-transport-axum" }
hydracache-loadgen = { path = "../../crates/hydracache-loadgen" }
hydracache-redis-compat = { path = "../../crates/hydracache-redis-compat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

