[workspace]

[package]
name = "allocator-profile-073"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
allocator-system = ["hydracache/allocator-system"]
allocator-mimalloc = [
    "hydracache/allocator-mimalloc",
    "dep:libmimalloc-sys",
    "dep:mimalloc",
]
allocator-jemalloc = [
    "hydracache/allocator-jemalloc",
    "dep:tikv-jemalloc-ctl",
]

[dependencies]
hydracache = { path = "../../crates/hydracache" }
libmimalloc-sys = { version = "0.1.49", features = ["extended"], optional = true }
mimalloc = { version = "0.1.48", features = ["extended"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tikv-jemalloc-ctl = { version = "0.6", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

