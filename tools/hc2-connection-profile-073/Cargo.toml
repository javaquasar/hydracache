[workspace]

[package]
name = "hc2-connection-profile-073"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
hydracache-client-hc2 = { path = "../../crates/hydracache-client-hc2" }
hydracache-client-transport-axum = { path = "../../crates/hydracache-client-transport-axum" }
hydracache-loadgen = { path = "../../crates/hydracache-loadgen" }
hydracache-server = { path = "../../crates/hydracache-server" }
rcgen = "0.14"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
