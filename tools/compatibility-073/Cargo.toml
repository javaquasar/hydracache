[workspace]

[package]
name = "compatibility-073"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bytes = "1"
hydracache = { path = "../../crates/hydracache", features = ["durable-value-store"] }
hydracache-client-hc2 = { path = "../../crates/hydracache-client-hc2" }
hydracache-client-protocol = { path = "../../crates/hydracache-client-protocol" }
hydracache-client-transport-axum = { path = "../../crates/hydracache-client-transport-axum" }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
