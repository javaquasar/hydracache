command = { program = "cargo", args = ["test", "-p", "xtask", "--test", "imap_sbom_075", "--locked", "--", "actual_provenance_reconstruction_rejects_archive_and_policy_substitution", "--ignored", "--exact"], cwd = ".", platform = "any" }

[[gate]]
