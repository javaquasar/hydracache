schema_version = 1
release = "0.75.0"

[[gate]]
id = "ignored.xtask.imap075.prepared-native-daemon-smoke"
kind = "ignored_test"
source = "crates/xtask/tests/imap_soak_075.rs"
package = "xtask"
target = "imap_soak_075"
test = "actual_prepared_native_and_daemon_segments_preserve_workers_and_verify_rounds"
reason = "Requires current managed Java and daemon artifacts; coverage capture runs this short smoke after preparation"
tier = "fast"
required_tools = ["cargo", "java"]
timeout_seconds = 180
owner_release = "0.75.0"
ship_mandatory = true
ci = { workflow = ".github/workflows/imap-075.yml", job = "qualification", step = "Run bounded local proofs" }
command = { program = "cargo", args = ["test", "-p", "xtask", "--test", "imap_soak_075", "--locked", "--", "actual_prepared_native_and_daemon_segments_preserve_workers_and_verify_rounds", "--ignored", "--exact"], cwd = ".", platform = "any" }

[[gate]]
id = "ignored.xtask.imap075.actual-cargo-closure"
kind = "ignored_test"
source = "crates/xtask/tests/imap_sbom_075.rs"
package = "xtask"
target = "imap_sbom_075"
test = "actual_host_filtered_cargo_graph_replays_compiler_feature_and_dependency_closure"
reason = "Requires the current preparation's owned five-stage compiler and metadata directory; capture supplies its exact path"
tier = "fast"
required_env = ["IMAP075_CARGO_FIXTURE"]
required_tools = ["cargo"]
timeout_seconds = 180
owner_release = "0.75.0"
ship_mandatory = true
ci = { workflow = ".github/workflows/imap-075.yml", job = "qualification", step = "Run bounded local proofs" }
command = { program = "cargo", args = ["test", "-p", "xtask", "--test", "imap_sbom_075", "--locked", "--", "actual_host_filtered_cargo_graph_replays_compiler_feature_and_dependency_closure", "--ignored", "--exact"], cwd = ".", platform = "any" }

