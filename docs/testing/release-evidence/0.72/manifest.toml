schema_version = 1
release = "0.72.0"
status = "in_progress"

[[work_item]]
id = "W2-contracts"
status = "implemented"
source = "crates/hydracache-observability/src/management.rs"
test = "crates/hydracache-observability/tests/management_schema_072.rs"
gate = "cargo test -p hydracache-observability --test management_schema_072 --locked"

[[work_item]]
id = "W2-local-routes"
status = "implemented"
source = "crates/hydracache-server/src/management_http.rs"
test = "crates/hydracache-server/tests/management_http.rs"
gate = "cargo test -p hydracache-server --test management_http --locked"

[[work_item]]
id = "W3-cluster-aggregation"
status = "implemented"
source = "crates/hydracache-server/src/management_aggregation.rs"
test = "crates/hydracache-server/tests/management_aggregation_072.rs + module reducer/cancellation tests"
gate = "cargo test -p hydracache-server --test management_aggregation_072 --locked && cargo test -p hydracache-server --lib --locked management_aggregation"

[[work_item]]
id = "W4-dashboard-history"
status = "implemented"
source = "crates/hydracache-server/src/management_http.rs + console/{index.html,app.js,history.js,style.css}"
test = "crates/hydracache-server/tests/{management_http,admin_http}.rs + console/tests/{history.test.js,console_readonly.spec.js}"
gate = "npm --prefix console run build && npm --prefix console test && cargo test -p hydracache-server --test management_http --locked && cargo test -p hydracache-server --test admin_http --locked"

[[work_item]]
id = "W5-members-partitions-placement"
status = "implemented"
source = "crates/hydracache-observability/src/management.rs + crates/hydracache-server/src/{management_http,management_topology,bootstrap}.rs + console/{index.html,app.js}"
test = "crates/hydracache-observability/tests/management_schema_072.rs + crates/hydracache-server/tests/management_topology_072.rs + console/tests/console_readonly.spec.js"
gate = "cargo test -p hydracache-observability --test management_schema_072 --locked && cargo test -p hydracache-server --test management_topology_072 --locked && npm --prefix console test"

[[work_item]]
id = "W6-client-lifecycle"
status = "implemented"
source = "crates/hydracache-observability/src/management.rs + crates/hydracache-server/src/{hc2,bootstrap,management_http}.rs + console/{index.html,app.js}"
test = "crates/hydracache-server/tests/management_clients_072.rs + crates/hydracache-server/src/hc2.rs + console/tests/console_readonly.spec.js"
gate = "cargo test -p hydracache-server --test management_clients_072 --locked && cargo test -p hydracache-server --lib --locked hc2 && npm --prefix console test"

[[work_item]]
id = "W7-auth-scoped-namespaces-caches"
status = "implemented"
source = "crates/hydracache-client-transport-axum/src/lib.rs + crates/hydracache-observability/src/management.rs + crates/hydracache-server/src/{bootstrap,management_http}.rs + console/{index.html,app.js}"
test = "crates/hydracache-server/tests/management_namespaces_072.rs + crates/hydracache-client-transport-axum/tests/client_surface.rs + console/tests/console_readonly.spec.js"
gate = "cargo test -p hydracache-server --test management_namespaces_072 --locked && cargo test -p hydracache-client-transport-axum --locked && npm --prefix console test"

[[work_item]]
id = "W8-health-engine"
status = "implemented"
source = "crates/hydracache-observability/src/management_health.rs + crates/hydracache-server/src/management_http.rs + console/{index.html,app.js}"
test = "crates/hydracache-observability/tests/management_health_072.rs + crates/hydracache-server/tests/management_health_072.rs + console/tests/console_readonly.spec.js"
gate = "cargo test -p hydracache-observability --test management_health_072 --locked && cargo test -p hydracache-server --test management_health_072 --locked && npm --prefix console test"

[[work_item]]
id = "W9-fixed-prometheus-history"
status = "implemented"
source = "crates/hydracache-server/src/{config,management_history,management_http,admin_http}.rs + console/{index.html,app.js}"
test = "crates/hydracache-server/tests/management_history_072.rs + crates/hydracache-server/tests/management_http.rs + console/tests/console_readonly.spec.js"
gate = "cargo test -p hydracache-server --test management_history_072 --locked && cargo test -p hydracache-server --test management_http --locked && npm --prefix console test"
