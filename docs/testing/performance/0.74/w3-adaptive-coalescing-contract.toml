schema_version = 1
release = "0.74"
contract_id = "w3-adaptive-coalescing-074-v1"
state = "preregistered-before-candidate"
promotable = false
hypothesis = "coalesce only when a second complete RESP frame is already buffered; preserve the exact pipeline-1 response path"
baseline_product_sha = "461c6c298419251dd208bc2949ae92fc594a9cf1"
baseline_measurement_sha = "7c5e0d09598c6ede551c3dc00f1a6bbced63c5f1"
candidate_source_sha = "UNRESOLVED"
transport = "loopback-tcp"
operations = ["get", "set"]
pipeline_depths = [1, 10, 50]
concurrency = [1, 8, 32]
payload_bytes = 64
key_space = 262144
seed = 740074
operations_per_sample = 160000
warmup_operations_per_sample = 16000
pairs = 5
pair_order = "abba-counterbalanced-v1"
instrumentation_enabled = true
numeric_claims_allowed = false

[activation]
minimum_complete_frames_in_current_read = 2
timer_allowed = false
cross_read_delay_allowed = false
pipeline_one_uses_existing_write_response = true
maximum_replies_per_batch = 256
