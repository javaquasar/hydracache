maximum_write_calls_per_reply = 0.20
maximum_flush_calls_per_reply = 0.20
minimum_goodput_ratio = 1.20
maximum_cpu_per_operation_ratio = 1.02
maximum_p99_ratio = 1.03
minimum_favorable_pairs = 4

[pipeline_one_non_regression]
write_calls_per_reply = 1.0
flush_calls_per_reply = 1.0
minimum_goodput_ratio = 0.98
maximum_cpu_per_operation_ratio = 1.03
maximum_p99_ratio = 1.03
minimum_passing_pairs = 5

[semantic_guards]
exact_response_bytes = true
response_order = true
fragmented_frames = true
partial_writes = true
pending_writes_and_flushes = true
disconnect_during_reply = true
slow_reader_backpressure = true
cross_connection_fairness = true
oversized_reply_progress = true
subscription_barrier = true
hello_dialect_transition = true
quit_flushes_before_close = true
native_surfaces_unchanged = true

[disposition]
