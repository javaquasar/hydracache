decision = "sync-backend-insufficient"
conclusion = "The sync backend reduced the incremental no-op-listener allocation cost, especially for removal, but retained a material insert penalty and does not preserve HydraCache's asynchronous backend semantics. A sync migration is not a sufficient instrumentation fix."
next_evidence = "Keep D2 unauthorized; review a lab-only exact nonblocking removal-observation or replacement-ownership design and freeze allocation/RSS rejection limits before any product candidate measurement."

