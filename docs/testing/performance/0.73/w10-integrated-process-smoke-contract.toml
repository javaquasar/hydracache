event_interaction = "Exercise shared core tags, shared HC2 Bytes, and the one-MiB outbound encoded-byte budget together through a real mTLS stream. Drain and stalled phases must preserve bytes/order and return live subscription, pending, and queued owners to zero on close."
expiry_tag_interaction = "Exercise active expiry, tagged replacement, tag invalidation, idle, and refill through the client surface and local cache. Final entry/quota/tag/retained owners must reconcile exactly."
mixed_protocol_interaction = "Run the frozen 35/30/15/10/5/5 operation allocation across real HC2, RESP, HC1, direct, tag, and TTL surfaces against one candidate process boundary where applicable. Record attempted, success, rejection, timeout, late, and incomplete by surface; aggregate success cannot hide a harmed surface."
durable_interaction = "Run durable write/overwrite/read/reopen and confirmed GC as a separate sync-acknowledged companion. Preserve record/checksum/fsync semantics and compare no timing or residency number locally."
canary = "HYDRACACHE_CANARY_DEFECT=W10 must either drop one scheduled outcome or retain one owner after close; the runner must fail with HC-CANARY-RED:W10."
success_rule = "Every one of four independently started cells executes the exact scenario, reports complete zero-error outcome accounting, passes semantic assertions and cleanup/reconciliation, retains stdout/stderr and a receipt hash, and rejects the W10 canary."
falsifier = "A fixture-only protocol substitute, zero executed cell, changed weights, pooled persistence, hidden failure, missing final owner checkpoint, or timing-based acceptance must fail the smoke."
next_decision = "After implementation and one passing local smoke plus red canary, decide whether a protected-host I73/C73 focused contract is warranted. The smoke itself cannot authorize dispatch or a claim."
