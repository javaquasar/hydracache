allocation_interpretation = "Required steady-read allocation stays essentially cardinality-independent, while fill and overwrite gross bytes per operation grow sharply with store cardinality in both payload sizes. The shape matches DurableValueStore::would_fit calling total_bytes, which scans and decodes every record before each upsert. At 256 records, a 4 KiB overwrite allocates about 1.147 MB gross per operation to update a 4 KiB logical value."
durability_interpretation = "RAM-only admission remains flat. Async-bounded admission allocates only the queued record and performs zero write transfer; its later drain has almost the same allocation and IO shape as sync admission because each DurableValueStore::upsert scans and flushes. This classifies where cost moves, but the local transfer counter does not prove physical-device write amplification."
gc_interpretation = "Repair-pending GC removes nothing and writes nothing. Repair-confirmed GC removes and reclaims exactly the registered cardinality. Its roughly 4.5 KB gross per removal and per-record write transfer record the current remove-and-flush loop without authorizing a semantics change."
memory_interpretation = "All 120 Windows attempts explicitly report the anonymous/file resident split as unavailable. Working set, private commit, directory length, and process IO remain separate observations; none is reinterpreted as Sled file-backed page-cache residency. A Linux smaps_rollup run would be required for that claim."
decision = "authorize-cached-durable-budget-total-candidate"
next_evidence = "Preregister a narrow candidate that initializes one validated logical-budget total at open and updates it after successful insert/remove ownership changes, while preserving the public total_bytes validation scan, store format, checksums, budget rejection, recovery, durability modes, and GC behavior. Rerun the full 120-process matrix and reject on any semantic drift."

