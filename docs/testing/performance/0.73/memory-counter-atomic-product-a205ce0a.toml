safety_argument = "The retained counter atomic operation linearizes inside an already-active mutation guard. If the returned previous value proves overflow or underflow, the permanent fault bit is published before that guard can release quiescence. barrier and capture check the fault first, so neither a wrapped counter nor a transiently quiescent state can be admitted as exact."
scope_argument = "The active-mutation, version, and epoch algorithms retain their checked CAS loops because their wrap and release windows participate directly in synchronization. This optimization removes retries only from the eight data counters covered by the preregistered contract."
