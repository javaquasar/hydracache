profile_tool = "tools/hc2-connection-profile-073"
connections = 8
subscriptions_per_connection = 1
offered_value_bytes_per_connection = 8388608
value_bytes = [4096, 262144]
mutations_per_connection = [2048, 32]
server_outbound_item_capacity = 16
settle_milliseconds = 2000
stability_window_milliseconds = 500
pairs_per_value_size = 5
counterbalanced_order = ["drained/unpolled", "unpolled/drained", "drained/unpolled", "unpolled/drained", "drained/unpolled"]
scenarios = ["drained-transport-reader", "unpolled-transport-reader"]
independent_process_pairs_required = true
same_encoded_inputs_within_pair_required = true
handshake_ack_required_before_stall = true
subscription_ack_required_before_stall = true
request_stream_remains_open_at_snapshot = true
response_stream_object_retained_at_snapshot = true
production_counter_addition = false
product_mutation_allowed = false
candidate_data_allowed = false
dedicated_host_run_allowed = false
promotable = false
exact_server_queued_byte_claim_allowed = false
release_numerical_claim_allowed = false
control_invariant = "Every offered mutation is dispatched and produces one invocation response plus one matching event while all eight raw connections and subscriptions remain live at the server snapshot."
treatment_invariant = "After handshake and subscription acknowledgements, the raw peer retains but never polls the response stream; dispatch stops below the offered mutation count and remains unchanged for the 500 ms stability window while all eight connections and subscriptions remain live."
payload_invariant = "Each connection offers exactly 8 MiB of values in both payload cells: 2,048 x 4 KiB or 32 x 256 KiB. Keys, generations, correlation ordering, TLS identity, and connection count stay equal within each drained/unpolled pair."
close_invariant = "Dropping raw request senders and response streams must reconcile server connections, subscriptions, sessions, and pending invocations to zero, with accepted connections equal to closed connections."
falsifier = "Reject and retain an attempt on process failure or stderr, missing handshake/subscription acknowledgement, wrong offered volume, incomplete drained control, treatment dispatch reaching the full offered count, treatment dispatch changing during the stability window, wrong live cardinality, or incomplete close reconciliation. Never replace a failed attempt silently."
interpretation_limit = "This local diagnostic can attribute payload-size-sensitive process retention to a genuinely unpolled HC/2 response path. It cannot observe exact bytes in the Tokio channel, separate tonic/HTTP2/TLS/socket owners, establish a release regression, or authorize a byte-cap candidate by itself."
decision_rule = "A byte-cap candidate may be preregistered only if the unpolled-minus-drained server working-set or pagefile delta grows materially with payload size in repeatable paired results while the treatment stall and cleanup invariants pass. Otherwise retain the existing 16-item bound and move to transport-owner instrumentation or close W5 without a queue change."

