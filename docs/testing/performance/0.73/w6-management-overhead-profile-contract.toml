falsifier = "Reject and retain an attempt on process failure or stderr, a management route mounted while disabled, any management-owned wakeup without a request, a cache-hit transport call, cursor retention above 1,024 records, a history-disabled upstream call, missing response-byte accounting, or incomplete allocation/OS-memory fields. Never replace a failed attempt silently."
interpretation_limit = "This local profile separates router construction, request serialization, aggregate cache reuse, cursor retention, and disabled-history behavior. Process memory still includes the Rust runtime, allocator, shared ServerRuntime, and admin router; it cannot establish dedicated-host goodput or p99 claims."
decision_rule = "Authorize a W6 product candidate only when the repeated matrix identifies one management-owned fixed or per-read owner, the corresponding exact logical invariant remains testable, and the change does not weaken response, cursor, concurrency, or history bounds. If idle management produces no wakeups and no material retained owner, close that branch as measured-no-win and optimize only a demonstrated request path."
next_decision = "Implement the isolated profiler without production counters, run the frozen matrix in independent processes, retain every raw result, and classify fixed, cache, cursor, serialization, and history owners separately."
