source_audit = "CacheEntry already shares one immutable Arc tag slice across entry clones, but TagIndex owns String keys and public CacheEvent stores Vec<String>. Tokio broadcast Clone therefore deep-copies every event tag string for each receiving subscriber."
estimator_interpretation = "The exact retained-byte estimator reports 184 bytes per logical membership for both topologies. It intentionally does not model HashMap topology or allocator capacity, so equal estimates do not imply equal allocator retention."
index_interpretation = "At 64 tags, shared topology added about 154.8 live allocator bytes per membership over the zero-tag cell while unique topology added about 413.9. The difference is expected ownership of distinct outer tag maps and is not by itself a safe interning candidate."
event_interpretation = "After subtracting the zero-tag event cost, one subscriber allocated 55.87 bytes and eight subscribers allocated 56.00 bytes per delivered 32-byte tag. This matches one 24-byte String header plus one 32-byte allocation and identifies CacheEvent Clone as the repeatable fan-out owner."
invalidation_interpretation = "Invalidation removed exactly the requested fan-out, left zero memberships and one bounded generation record, and remained linear in required key removal. No independent invalidation candidate is justified by this local profile."
decision = "preregister-shared-cache-event-tags-candidate"
next_evidence = "Freeze a candidate contract before mutation, replace CacheEvent Vec<String> ownership with an immutable shared slice while preserving the public tags accessor and event equality, then rerun all 215 local cells and the tag-index model, event, reconciliation, and stale-load fencing tests."

