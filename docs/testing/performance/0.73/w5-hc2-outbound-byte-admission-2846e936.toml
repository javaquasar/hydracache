interpretation = "The one-MiB encoded-envelope admission budget left the 4 KiB item-bound dispatch effectively unchanged (4,160 to 4,152) and reduced the 256 KiB stalled median from 128 to 104 dispatches. High-payload unpolled-minus-drained server working set fell by 6,717,440 bytes (29.6%) and pagefile by 7,495,680 bytes (33.1%). Every high-payload candidate pair was below every retained baseline pair."
correctness = "Encoded length is charged before the existing 16-item channel; the queued wrapper owns the permit until tonic polls the item. Unit tests prove exact charge, blocking, one-oversize progress, poll release, closed-receiver release, and disconnect cleanup. The real-mTLS test preserves event bytes/order and reconciles all live HC/2 resources. No frame is rejected by the new admission layer."
claim_boundary = "The accepted change bounds only encoded ServerEnvelope bytes waiting in HydraCache's application queue. The remaining high-payload retention includes a producer-held frame, a frame already polled by tonic, Hyper/h2's peer-advertised receive window, protobuf/TLS work buffers, sockets, and allocator high-water pages. The local percentages are diagnostic, non-promotable, and not release claims."
small_payload_result = "The 4 KiB paired working-set median changed from 9,216,000 to 9,863,168 bytes while its ranges overlapped and dispatch stayed effectively unchanged. This is consistent with the existing 16-item limit remaining the active bound for small frames; it is not accepted as a small-frame memory improvement."
decision = "retain-byte-admission-for-integrated-w5-w2-campaign"
next_evidence = "Update the W5 ledger/article, keep the candidate in the integrated release branch, and move to the next unresolved release-0.73 workstream. Do not authorize a dedicated-host run for this isolated subproblem."

