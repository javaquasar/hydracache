owner = "Moka post-removal observer delivery clones CacheEntry; CacheEntry::clone deeply clones Box<[String]> tags before the HydraCache callback can move those tags into its bounded cleanup ticket."
source_argument = "Pinned Moka 352e53fa calls observer.observe(key, entry.value.clone(), cause). HydraCache CacheEntry derives Clone and stores tags as Box<[String]>. Counters-only stays near off, get stays near off, and mutation scenarios acquire the allocation only when the observer is enabled."
interpretation = "The noop observer adds 76--118 B/op to isolated mutation families. Production callback work has a negative or near-zero adjacent allocation delta, so it is not the positive gross-allocation owner. Remove/refill and tag-invalidate/refill retain 76.17 and 85.71 B/op off-to-production and explain the mixed +24.80 B/op result."
decision = "preregister-shared-immutable-entry-tags"
next_evidence = "Replace only CacheEntry and CleanupTicket tag ownership with a shared immutable representation so Moka value cloning and queue publication do not deep-clone tag strings. Preserve versioned cleanup, retained estimates, bounded queue behavior, and every public API; rerun correctness and this exact local matrix before any dedicated-host run."

