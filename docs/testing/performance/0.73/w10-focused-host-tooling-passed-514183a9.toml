correction = "Keep the new workflow reusable and route the non-I73 source through the existing manual baseline workflow already registered on main; the protected environment, serialized concurrency, full matrix, and exact role identities remain unchanged."

[[invalid_attempt]]
id = "nested-concurrency-self-deadlock"
outcome = "workflow-run-36195607970-failed-before-runner"
reason = "The registered entry and called reusable workflow both requested performance-reference-073-host, so GitHub detected a nested concurrency deadlock and created no measurement job."
correction = "Let the outer registered workflow retain the shared host group and give the nested reusable call a run-unique technical group. Direct dispatch still uses the shared group. No runner or benchmark process started in the failed run."

