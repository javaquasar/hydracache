reason = "Pre/post calibration spreads passed at 1.45% and 2.32%, but the new workflow omitted HYDRACACHE_PERFORMANCE_COLLECTOR_CPUSET. Both host receipts recorded collector null, result blocked-host, and ship_evidence_eligible false."
correction = "Declare the frozen collector CPU set 0 alongside daemon 5-6 and loadgen 7 before preflight. The failed run retained artifact 10889958395 (zip SHA-256 57e0feab4666ebe4daf2784ae0b6a2b20424a61f6d87f2a27dfafa22b5dda2d1), including preflight 9197e8f776f3a169d45de0b87178069c2bf892dd48b70c57051fd1dbb0d463ae and postflight 4187a46722ff02155d87b7aeec5a56c7d21675680f0dc4546f9b4217d7ea2296. No role build, canary, or benchmark process started."

[[invalid_attempt]]
id = "overlay-missing-workspace-root"
outcome = "workflow-run-36196189494-build-failed-before-canary"
reason = "Both exact server binaries built and host pre/post calibration passed, but the I73 harness dependency manifest could not inherit workspace.package fields because staging linked crates without the exact role root Cargo.toml."
correction = "Add read-only symlinks from each staging root to that role's exact root Cargo.toml. This restores Cargo workspace inheritance without copying or patching a product manifest. Artifact 10889882901 retained both host receipts (zip SHA-256 b8191ccd86c9d642b98bfa53dc7dce387652caebfb7feadc3175b2dc6482b9fc); no canary or benchmark process started."
