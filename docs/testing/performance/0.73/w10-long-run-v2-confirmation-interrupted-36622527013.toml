failure = "At 2026-10-01T01:58:42Z GitHub Actions emitted 'The operation was canceled' while the C73 harness was emitting healthy 30-second runner heartbeats. The artifact and job log contain no harness, daemon, workload, calibration or resource failure. GitHub's retained log and public run/job APIs do not identify the external cancellation initiator, so the causal boundary is orchestration cancellation rather than a more specific actor or host mechanism."
artifact_boundary = "The complete I73 role and partial C73 series are retained as one immutable incomplete attempt. They cannot be promoted, compared as a completed pair, spliced into another attempt or used for a release numerical claim."
correction = "Keep six-hour qualification serialized in one bounded job, but split confirmation into two sequential role-isolated jobs under one approved parent workflow and one host concurrency lease. The I73 job writes a checksummed continuation artifact; the C73 job independently verifies every continuation hash and the complete I73 receipt before starting, repeats build and identity guards, captures pre/post C73 calibration, and alone seals the final pair. Each confirmation job is capped at 1,740 minutes, below the interrupted single-job lifetime, while product identities, role order, workload, per-role duration, estimator, seed and thresholds remain unchanged."
