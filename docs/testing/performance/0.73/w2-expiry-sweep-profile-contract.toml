hypothesis = "The current bounded sweep allocates one tuple-key clone for every examined entry, one additional clone for every expired entry, and one clone for the next cursor. Gross allocation should therefore increase monotonically with expired cardinality while cursor wrap remains equal to the no-expiry case."
falsifier = "Reject attribution if examined cardinality exceeds the scan limit, cursor wrap skips or duplicates logical work, cloned identity bytes differ from the fixed key shape, any process fails, or the no-expiry and cursor-wrap medians differ."
interpretation_limit = "This profile-only local probe can attribute copy churn and select a candidate. It cannot establish latency, CPU, RSS, capacity, or a release-grade numerical improvement."
next_decision = "If the hypothesis survives, preregister a D2 candidate that avoids owning every examined key while preserving bounded progress, expiry removal, tenant quota release, and cursor semantics."
