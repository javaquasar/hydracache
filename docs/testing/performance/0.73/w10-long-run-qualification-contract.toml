primary_guard = "The exact C73 process must complete the same fixed-cardinality mixed work for the same duration as exact I73 with zero unexpected outcomes, exact per-surface/event/durable accounting, final owner reconciliation, stable host identity and calibration, and no candidate-only positive post-warmup growth beyond the baseline-only 95% moving-block confidence bound in both combined process RSS and anonymous PSS."
baseline_bound_rule = "Run and seal I73 first. For each resource signal, compute the Theil-Sen post-warmup slope and its moving-block 95% upper confidence bound using seed 730073, 10,000 resamples and 12 consecutive one-minute samples per block. Freeze those two bounds before C73 starts; candidate observations may not amend them."
candidate_slope_rule = "Compute C73 with the identical estimator and windows. Both the C73 combined-RSS and anonymous-PSS 95% upper slope bounds must be less than or equal to the corresponding frozen I73 upper bounds, with negative bounds clamped to zero for the decision. Peak RSS, faults and file-backed PSS remain diagnostics and cannot rescue either failed primary signal."
comparison_guard = "Long-run goodput, CPU per completed operation and p99 retain the focused 2%, 3% and 3% candidate-versus-I73 regression ceilings. This single long pair is a confirmation guard, not an independent improvement estimator and not a replacement for the completed five-pair focused campaign."
checkpoint_rule = "Capture monotonic time, completed outcomes, all surface counters, event owners, direct-cache owners, process RSS, anonymous/file PSS, peak RSS, CPU, faults, threads and FDs every 60 seconds, plus explicit pre-work, final-work, post-idle and post-reconciliation checkpoints. Missing, reordered, duplicated or more-than-90-second-gapped coverage fails the role."
phase_rule = "Each role uses one independently started continuous process: 5,000 warmup operations excluded from measurement, the frozen 12,000 operations/second mixed trace for exactly the phase duration, a complete drain, durable companion, five-minute post-work idle, and final reconciliation. No process restart or selected sub-window may replace a failed role."
promotion_rule = "A complete six-hour I73/C73 pair may open only the separately dispatched 24-hour confirmation at the same identities and contract. The 24-hour pair may open final C73/release-archive work only; neither phase by itself authorizes a numerical improvement, allocator/RSS claim, capacity claim or tag."
artifact_rule = "Retain minute checkpoints and compact receipts, not payloads or secrets. Each role is capped at 64 MiB and the complete packet at 256 MiB. Oversize, missing-final, expired-only, secret-bearing, mixed-attempt or unhashable artifacts fail closed."
failure_rule = "Any identity, overlay, workload, duration, cardinality, host, lease or calibration drift; process restart; missing heartbeat/final checkpoint; incomplete outcome; owner mismatch; resource-bound failure; artifact overflow; canary survival; compatibility regression; or favorable retry rejects the phase and preserves the complete attempt."
next_evidence = "Implement the continuous checkpointing harness, analyzer, expected-red canary and manual protected workflow; locally run only a duration-scaled semantic/tooling falsifier before requesting the six-hour lease."

