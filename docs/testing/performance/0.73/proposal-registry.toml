source_findings = [
  "moka 0.12.15 future cache creates a per-key lock path whenever a removal notifier is enabled",
  "new inserts acquire that optional key lock before the backend knows whether the operation replaces an entry",
  "updates and invalidations add shared boxed notification futures and cancellation guards",
  "moka 0.12.16 retains blocking synchronous/asynchronous eviction-listener APIs and exposes no nonblocking post-removal observer",
  "a counterbalanced future-versus-sync microprobe found that sync reduced but did not eliminate no-op-listener allocation overhead",
  "a lab-only versioned observer reference model passes ordering, duplicate, saturation, reconciliation, shutdown, and removal-cause falsifiers without changing the product cache",
  "an isolated Moka patch proved that omitting listener key locks removes the insert allocation penalty while boxed removal delivery remains a separate cost",
  "a direct synchronous Moka observer matched listener-off allocation, delivered every removal cause, and passed the integrated versioned replacement cleanup falsifier",
]

rejected_approaches = [
  "remove the listener and accept incomplete automatic-eviction accounting",
  "decrement counters from CacheEntry Drop, because Moka clones values and final-drop time is not logical removal time",
  "optimize only the HydraCache callback, because a registered no-op listener reproduced most fill and RSS overhead",
  "replace exact bounded snapshots with an unannounced full-map reconciliation walk",
  "raise allocation or RSS limits after observing the candidate",
  "migrate to Moka sync solely to reduce listener cost, because insert overhead remained material and the migration changes async semantics",
]

candidate_options_requiring_d2 = [
  "prototype an upstream-compatible nonblocking post-removal observer plus version-conditional bounded cleanup/drain lifecycle",
  "prototype a backend strategy that provides exact removal ownership without listener-enabled mutation locking",
]

required_correctness_tests = [
  "explicit remove, overwrite, invalidate, and flush reconcile exactly",
  "TTL expiry and capacity eviction reconcile exactly",
  "tag memberships and bounded generation state return to the expected owner count",
  "concurrent snapshots fail non-atomic rather than reporting false exactness",
  "cancellation and shutdown drain every acknowledged removal",
  "default and all-feature public compatibility remain unchanged",
]

required_regression_guards = [
  "goodput regression <= 2%",
  "CPU per request regression <= 3%",
  "p99 latency regression <= 3%",
  "allocation and RSS limits frozen before candidate data",
]

next_evidence = "Choose an independent reviewer and freeze the practical effect and allocation/RSS rejection limits from baseline-only evidence, then authorize or reject D2 for the upstream/fork dependency proposal and product integration."
