owner = "Moka future-cache removal notification path"
hypothesis = "Exact removal accounting can avoid listener-enabled per-mutation key locking only through a nonblocking post-removal observation seam or an equally exact replacement ownership design."
primary_metric = "fill_allocated_bytes_per_operation"
practical_minimum_effect = "unfrozen-blocker"
threshold_status = "must be independently reviewed and frozen before D2"
compatibility_outcome = "public configuration, value-byte capacity, expiry, invalidation, tag cleanup, snapshot, and reconciliation semantics remain unchanged"
rollback_class = "remove isolated implementation and restore the exact I73 instrumentation path"
dependency_delta = "none authorized; a Moka patch, upgrade, fork, or backend replacement requires separate dependency review"
review_status = "required-before-d2"
