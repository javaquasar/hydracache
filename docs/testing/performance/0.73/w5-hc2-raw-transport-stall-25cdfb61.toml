working_set_payload_ratio = 2.459201388888889
interpretation = "A peer that retains but never polls the production HC/2 response stream creates repeatable, bounded, payload-sensitive server retention. Relative to drained controls, the server working-set delta was positive in all ten pairs and the median rose from 9,216,000 bytes at 4 KiB to 22,667,264 bytes at 256 KiB. This is a local process-level result, not an exact Tokio-channel byte count."
source_attribution = "The locked Hyper 1.11.1 client defaults to a 2 MiB stream receive window and a 5 MiB connection receive window. Median treatment dispatch was 520 mutations per peer at 4 KiB and 16 per peer at 256 KiB. The first shape is approximately 512 value-bearing events authorized by the 2 MiB stream window plus a bounded application-channel tail; the second is approximately eight window-resident events plus a similar tail. Gap and invocation frames share those budgets, so this is a source-supported decomposition rather than an exact occupancy claim."
fixture_failures = "Before the frozen 25cdfb61 binary, one smoke run misclassified legitimate EventGap frames as unexpected and one exposed that simply dropping a stalled tonic stream did not reconcile promptly. The fixture now counts gaps and, after the pressure snapshot, drains the already offered frames before close. Neither failed smoke was included or replaced in the 20-attempt matrix."
boundedness = "Every unpolled run stopped below the offered volume and stayed unchanged for 500 ms; every drained control completed all offered mutations; all unpolled snapshots had zero application-polled response frames; every attempt ended with eight accepted and eight closed connections and zero live server resources."
decision = "preregister-hc2-outbound-byte-admission-candidate"
next_evidence = "Freeze an application outbound-byte admission design that accounts encoded ServerEnvelope bytes while queued, preserves the existing 16-item limit, permits one bounded oversize frame without deadlock, and leaves HTTP/2/TLS/socket ownership explicitly outside the claim. Prove semantics and cleanup locally before any hosted candidate run."

