scope_variance = "The pre-implementation D2 file ledger omitted cache.rs, entry.rs, lib.rs, removal_observer.rs, tests/local_cache.rs, and deny.toml. Those files implement or admit only the already-authorized observer, accounting, versioned tag cleanup, tests, and exact dependency source. This receipt records the variance before any candidate measurement; no threshold or public surface changed."
shutdown_conclusion = "The observer owns no detached worker and publication has no await/cancellation point. Exact barriers drain accepted tickets or fail closed; at final cache drop, the queue, tag index, counters, and entries are destroyed under the same final Arc owner, so no acknowledged cleanup can outlive product state."
reentrancy_conclusion = "The Moka callback captures only RemovalObserver, whose synchronous observe method has no HydraCache handle, await, I/O, or cache operation; same-cache reentry is structurally unavailable."
