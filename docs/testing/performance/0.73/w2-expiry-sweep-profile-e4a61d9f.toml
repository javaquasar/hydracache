owner = "expiry_sweep_candidates clones all examined StoreKey tuples under the ClientSurfaceState store lock, clones every expired tuple again into the removal list, and clones the final examined tuple into the next cursor"
allocation_model = "A StoreKey contains three owned Strings. With the frozen 96-byte identity, every tuple clone performs three allocations and copies 96 payload bytes. The examined Vec reserves 256 * 72 = 18,432 bytes. Filtered expired collection grows geometrically, and gross realloc accounting charges every complete new buffer."
falsifier_result = "passed: every process examined exactly 256 entries; logical clone bytes matched the fixed identity; cursor wrap matched the no-expiry result exactly; allocation and byte counts were identical across all five processes per scenario"
interpretation = "The unavoidable owned removal list scales with expired cardinality, but the 18,432-byte examined vector and 24,576 bytes of examined-key string copies are paid even when no key expires. All of this allocation occurs while the store mutex is held. Lock-duration improvement is plausible but unmeasured and is not claimed."
decision = "preregister-d2-borrowed-scan-candidate"
next_evidence = "Preregister and implement a candidate that scans borrowed BTreeMap entries, owns only expired keys and one next cursor, preserves the 256-entry budget and wrap semantics, and proves tenant quota release before any dedicated-host run."

