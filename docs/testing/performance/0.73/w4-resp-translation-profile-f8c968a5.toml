translation_interpretation = "Binary-key translation produces the required redis-binary-v1- representation: 21 bytes for the empty sentinel and 16+2N bytes otherwise. Distinct 256-key batches therefore carry 36,864 logical structured bytes per operation. DEL distinct adds about 61 KB gross per operation over the other lookup batches, but changing its ownership or deduplication has greater semantic risk and is not the first candidate."
decode_interpretation = "RESP3 decode allocation ranges from 2.27 to 52.00 times input wire bytes in the frozen corpus and materially exceeds RESP2 for small and array-heavy shapes. The owner crosses external parser/value types, so the profile records it for later isolation rather than authorizing a broad parser rewrite."
encode_interpretation = "For 1 MiB responses, median gross allocation is almost exactly twice wire output. The encoder first fills a unique local BytesMut and then output.to_vec() allocates and copies a second full buffer. bytes 1.12.1 provides From<BytesMut> for Vec<u8>, which transfers the unique backing allocation instead of copying it."
decision = "authorize-zero-copy-bytesmut-to-vec-encode-candidate"
next_evidence = "Preregister a two-line ownership-transfer candidate for RESP2 and RESP3, rerun the same 92-scenario/460-process matrix, require byte-identical encode and roundtrip outputs, require at least 40% gross reduction in every 1 MiB encode cell, and bound decode/translation regression to 5%."

