decision = "Use the owned pinned fork for the 0.73 integration window; do not claim upstream review or acceptance. Upstream submission remains a separate post-integration action."
rationale = "The release needs a reproducible dependency seam now, while an external API review has an unbounded schedule. The fork is exact-SHA pinned, carries one focused commit, and has a one-commit crates.io rollback."

[maintenance]
repository_owner = "javaquasar"
integration_owner = "HydraCache project maintainer"
upstream_sync_cadence = "Review Moka upstream and re-run the complete dependency gate before every HydraCache release candidate and at least monthly while the fork remains selected."
advisory_cadence = "Run cargo deny on every dependency change and release candidate; triage a newly applicable advisory before merge."
update_policy = "Never move the revision in place. A new revision requires a new decision receipt, lockfile diff, SBOM, and full dependency gate."
rollback = "In one product commit, restore crates.io Moka 0.12.15 and the previous async eviction-listener wiring, regenerate Cargo.lock, and run the same correctness and package gates."

