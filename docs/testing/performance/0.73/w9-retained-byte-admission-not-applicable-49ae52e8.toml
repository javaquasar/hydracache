historical_policy_finding = "Release 0.71 deferred W2b because D0 found no fail-open retained-byte admission surface and W2a was deliberately reporting-only. W9 found no new pressure owner that invalidates that boundary."
legacy_capacity_finding = "HydraCacheBuilder::max_capacity remains Moka encoded-value-byte weight capped by max_entry_bytes. The retained estimator's try_moka_weight adapter is tested but is not installed in the builder."
existing_admission_finding = "AdmissionController bounds concurrent request count, admitted request bytes, and FIFO depth. Multitenancy enforces request/value limits plus tenant/namespace logical-value quotas with prevalidation, commit-aware accounting, rollback, replacement deltas, and idempotent release. These are owner-specific controls, not a global retained-cache policy."
pressure_reconciliation = "W2--W4 removed proven allocation/copy owners without demonstrating a remaining live-byte pressure owner. W5 found queued HC/2 output pressure and bounded the exact application queue at one MiB; the residual producer, tonic/h2, TLS, socket, and allocator retention is not one global logical retained owner. W6 retained existing bounded services after a measured-no-win result. W7 already enforces a separate durable logical-byte budget. W8 measured allocator retention, which logical admission cannot map to or guarantee returning to the OS."
semantic_risk = "A new max_retained_bytes control would add rejection, reservation, replacement, batch, retry, tenant, namespace, and compatibility semantics. Installing it without an evidenced unbounded owner would double-limit some paths, leave external retention untouched, and risk silently changing legacy eviction behavior."
decision = "close-w9-not-applicable-no-retained-byte-admission-candidate"
next_evidence = "Reopen W9 only when an equal-workload process or cgroup pressure incident reconciles to a still-unbounded logical retained owner after existing owner-specific limits. Preregister the owner, reservation lifecycle, scopes, rollback, absent-setting compatibility, and D2 thresholds before implementing or observing a candidate."

