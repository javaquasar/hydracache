repeats_per_scenario = 5
independent_processes_required = true
prebuilt_release_binary_required = true
metrics = ["gross_allocated_bytes", "live_allocated_bytes", "estimated_tag_retained_bytes", "tag_memberships", "event_tag_payload_bytes", "event_delivery_count", "invalidation_removed_keys", "elapsed_nanoseconds"]
