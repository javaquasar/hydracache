falsifier = "Reject and retain an attempt on process failure or stderr, wrong tag/member cardinality, failed exact memory reconciliation, missing or duplicated event delivery, event tag bytes differing from the inserted tag set, invalidation removing the wrong fan-out, stale load acceptance after generation advance, or missing allocator fields. Never replace a failed attempt silently."
interpretation_limit = "The retained-byte value is HydraCache's versioned reporting estimate, not allocator truth. Gross allocation includes cache/backend and public event work selected by the scenario; OS RSS and dedicated-host goodput/p99 are outside this local owner-classification profile."
decision_rule = "A W3 candidate may be preregistered only if one repeatable allocation component scales with tag cardinality or subscriber fan-out beyond the exact logical membership model, and its owner can be removed without changing public event contents, tag invalidation, generation fencing, or memory reconciliation. Otherwise close W3 as measured-no-win."
next_decision = "Implement a standalone allocation profile over the frozen cardinalities, topologies, subscriber counts, and invalidation fan-outs; use exact memory snapshots as the logical denominator and keep every process local and non-promotable."
