eligible_pressure_classes = [
  "live cache entries attributable to the retained estimator",
  "queued, inflight, or output reservations not already bounded at their owner",
]

ineligible_substitutes = [
  "allocator committed, reserved, resident, arena, or thread-cache high-water",
  "process RSS or private commit without logical-owner reconciliation",
  "file-backed page cache",
  "transient gross allocation or copied bytes",
  "a queue, durable store, request, batch, entry, tenant, or namespace already bounded at its owner",
]

authorize_d2_rule = "Authorize a separately reviewed D2 proposal only if an audit input demonstrates pressure at an eligible owner, the owner remains unbounded after W2--W8, and the proposed retained-byte reservation lifecycle covers replacement, batch rollback, retry, isolation, and release without changing legacy max_capacity."
not_applicable_rule = "Classify W9 not-applicable when no eligible unbounded pressure owner survives the audit. An estimator, a high RSS value, allocator retention, or the existence of admission primitives is not pressure evidence."
falsifier = "Any decision that substitutes RSS or allocator state for logical retained ownership, double-limits an already bounded owner, or changes behavior when the new setting is absent must fail the contract."
next_decision = "Audit every input, run existing accounting/admission/quota tests, and publish one terminal evidence document. Do not implement max_retained_bytes unless the terminal result is authorize-d2."
