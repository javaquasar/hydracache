primary_claim = "The exact integrated C73 candidate does not regress mixed-runtime goodput by more than 2%, CPU per completed operation by more than 3%, or p99 by more than 3% versus exact I73 at any frozen rate, while every protocol surface completes equal work and all final owners reconcile."
resource_classification = "Allocation, RSS, peak RSS, page faults, and durable file-backed observations are retained as paired diagnostic series only. Their thresholds remain unresolved by the frozen single-maintainer review and cannot be promoted or used to rescue a failed primary guard."
durable_companion_rule = "Run the same fixed-count sync-acknowledged write/overwrite/read/reopen/confirmed-GC companion once per independently started role process. Keep it separate from persistence-off mixed-runtime medians and require semantic equality before admitting a pair."
overlay_rule = "Build one standalone harness revision outside both product trees, record its source hash, and bind it by path dependencies to each exact checkout. The overlay may contain only harness, runner, workflow, and evidence-validation code; copying or patching product source, manifests, lockfiles, configuration defaults, or generated wire code invalidates the campaign."
pair_rule = "For each rate and repeat, alternate I73/C73 order from seed 731073. Both role processes use the same trace bytes, rate, warmup, duration, CPU/NUMA policy, system allocator, scenario, harness revision, and daemon/loadgen placement. Missing either role invalidates the pair."
surface_rule = "Record attempted, success, rejected, timeout, late, and incomplete separately for HC2, RESP, HC1, direct, tag invalidation, and TTL/refill. Aggregate goodput cannot hide a nonzero error field or unequal per-surface work."
calibration_rule = "Capture admitted host identity, mutable probes, lease, and calibration before and after the campaign block. Fingerprint, policy, lease, and calibration must remain within the frozen host-profile limits."
selection_rule = "Apply the preregistered paired estimator to within-pair C73-versus-I73 differences at each frozen rate. Every primary guard and every semantic/resource-owner falsifier must pass; do not add isolated W2-W7 percentages or select a favorable rate after observation."
failure_rule = "Retain every attempted process and pair. Any identity drift, overlay drift, missing outcome, per-surface harm, failed calibration, missing final checkpoint, canary survival, or primary regression rejects the focused candidate result and keeps long runs closed."
success_rule = "Five complete counterbalanced pairs at each of all three frozen rates pass equal-work, per-surface, semantic, owner, host, goodput, CPU, and p99 guards. Success may open published-0.72 compatibility and rollback qualification; it does not itself finalize C73 or authorize a long run."
next_evidence = "Implement and locally falsify the common standalone integrated harness plus manual-only protected workflow. Check in a tooling receipt with exact hashes before requesting a host dispatch."

