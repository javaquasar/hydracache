[[regression_budget]]
metric = "goodput_operations_per_second"
maximum_relative_regression = 0.02

[[regression_budget]]
metric = "cpu_seconds_per_operation"
maximum_relative_regression = 0.03

[[regression_budget]]
metric = "p99_latency_seconds"
maximum_relative_regression = 0.03

[[invalidating_condition]]
id = "unexpected-operation-outcome"
rule = "any unexpected error, timeout, rejection, late completion, or incomplete operation invalidates the pair"

[[invalidating_condition]]
id = "identity-drift"
rule = "source, binary, scenario, host, allocator, instrumentation, cardinality, or run-order mismatch invalidates the pair"

[[invalidating_condition]]
id = "calibration-drift"
rule = "failed pre/post calibration or mutable-host drift invalidates the pair"

[[invalidating_condition]]
id = "missing-final-checkpoint"
rule = "missing drain, reconciliation, owner, or final-cardinality checkpoint invalidates the pair"
