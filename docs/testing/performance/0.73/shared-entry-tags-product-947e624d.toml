remaining_cost = "The tag-invalidate/refill production delta of +14.83 B/op is consistent with materializing owned public event tags after the noop observer boundary. Replace and ttl-put negative production deltas are not treated as improvements because this allocator probe is diagnostic and medians from independent processes include allocator noise."
safety_argument = "Tags are immutable after CacheEntry construction. Moka's entry clone and the bounded CleanupTicket share the same Arc allocation, while event publication still clones each String into an owned public payload. Versioned cleanup, queue capacity, overflow/dirty handling, tag-index behavior, and retained estimator values remain unchanged."
