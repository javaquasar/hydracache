review = "The published crate contains the same 52 runtime source files and the same original Cargo manifest as release commit 2e358c51. The release-only diff from the measured observer revision changes CI pins, package metadata, changelog, and README; HydraCache enables future, while the README include is sync-doctest-only. No runtime source reads Cargo package name or version."
identity_boundary = "Source equivalence is not exact build identity. Moving from a Git package to crates.io changes Cargo's package/source identity and Cargo.lock, and no byte-identical final HydraCache binary has been established. The preregistered D4 rule therefore invalidates affected exact-candidate receipts instead of inferring equivalence from source inspection."
decision = "retain-corrected-old-qualification-but-do-not-transfer-to-registry-candidate"
cost_control = "Do not dispatch another protected-host run while version, release notes, generated/package assets, feature metadata, SBOM inputs, or lockfiles can still change. Freeze the final publishable candidate first, then run exactly one new six-hour qualification and, only if it passes, one 24-hour confirmation."
next_evidence = "Complete publication closure and freeze a final registry-backed C73 commit. Preregister its source, tree, lockfile, binaries, hydra-moka checksum, workflow and scenario identities before requesting the protected host."

