tradeoff_interpretation = "On this Windows trace mimalloc completes 4.13% sooner and incurs 90.80% fewer new page faults during refill, consistent with reuse of retained committed pages. The same reuse keeps much more memory after the exact empty delete checkpoint and leaves post-idle working set and private commit 8.75% and 11.71% above system. Neither direction dominates."
purge_interpretation = "The reviewed mimalloc force-collect path advances purge_calls and reports 1.125 MiB purged, but median working set falls only 0.55% while private and native committed bytes rise by about 0.08%. Purge therefore does not repair the tradeoff in this trace and is not authorized as runtime policy."
telemetry_interpretation = "The historical 0.71 adapter capability was too broad: enabling MIMALLOC_SHOW_STATS does not itself produce phase-native metrics, and an omitted metrics file falls back to RSS. The W8 profiler reads native JSON in-process, preserves the raw payload, and represents both the unavailable release-v3 live counter and allocator-owned resident bytes as null with reasons; process RSS remains an OS metric."
claim_boundary = "Local Windows screening can reject a default change and qualify system/mimalloc build paths. It cannot measure jemalloc, establish portable allocator rankings, equate committed/reserved/RSS concepts, or publish release-grade percentages."
external_blocker = "The current target is Windows, where the reviewed HydraCache jemalloc feature is unsupported. A complete system/mimalloc/jemalloc comparison with jemalloc allocated/active/resident/retained requires a separately admitted Linux host; system mallinfo2 availability and mimalloc release live accounting must remain explicit there."
decision = "retain-system-default-close-w8-deferred-linux-allocator-matrix"
next_evidence = "Run the same locked trace on an admitted x86_64 Linux host only if a release decision seeks an allocator default or target-specific allocator change; require all three allocators, allocator-native fields with reasons for gaps, an ADR, and the full compatibility/latency matrix before any product mutation."

