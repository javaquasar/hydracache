interpretation = "With equal real-mTLS connections, subscriptions, keys, values, and 110,000 completed mutations, unread application receivers added about 20.0 MB of client allocation churn and 21.2 MB of client working set relative to drained receivers. Server allocation and working-set paired medians remained around zero. The retained owner is therefore the bounded client subscription path, while the transport reader continues to drain HTTP/2."
fixture_correction = "The retained 0.71 helper opened 100 subscriptions but produced all mutations through clients[0]; HC/2 subscriptions are stream-local, so only one subscription received pressure. This profile uses one unique prefix and producer per connection, making all 100 consumers active pressure owners."
boundedness = "Every unread run converged to 51,300 accepted events and 117,493-117,495 explicit drops across 100 clients; every drained run delivered 110,000 events with zero drops. The 1,024-item client queue is bounded, but mixed Event/Gap item sizes mean this result is not a byte cap."
decision = "accept-application-slow-consumer-as-client-owned-no-server-candidate"
next_evidence = "Preregister a raw HC/2 peer that completes handshake/subscription and then stops polling the HTTP/2 response stream. Use it only to decide whether the server's 16-item outbound channel needs a byte cap; do not reinterpret this application-consumer result as network backpressure."

