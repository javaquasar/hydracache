required_active_invariant = "active_connections equals cardinality; accepted_connections minus closed_connections equals active_connections; active subscriptions, sessions, and invocations remain zero"
required_close_invariant = "after every group closes, live_resources_zero is true and accepted_connections equals closed_connections"
required_client_invariant = "every connected client reports zero pending invocations/subscriptions/sessions and all permit counts restored before close"
falsifier = "Any connection failure, timeout, counter mismatch, retained client resource, or nonzero server live owner after close fails the census and forbids a per-connection memory model."
interpretation_limit = "This census proves logical owner reconciliation and cardinality scaling only. It does not quantify bytes per connection, allocator state, RSS, TLS buffers, or task stacks."
next_decision = "If all cardinalities reconcile, use the exact live connection count as the denominator for a separate process-level allocation/RSS probe; otherwise fix ownership before measuring bytes."
