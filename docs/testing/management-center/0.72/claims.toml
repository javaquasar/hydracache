routes = ["/management/v1/namespaces", "/management/v1/namespaces/{namespace}/caches"]
privacy_rules = ["no-cross-tenant-count-oracle", "no-keys-values-tags"]
receipts = ["target/release-evidence/management-center/0.72/W7.json"]
status = "implemented"

[[claim]]
id = "MC72-HEALTH-TRUTH"
