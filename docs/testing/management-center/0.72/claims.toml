bounds = ["candidate-count", "reason-count"]
receipts = ["target/release-evidence/management-center/0.72/W5-placement.json"]
status = "implemented"

[[claim]]
id = "MC72-CLIENT-LIFECYCLE"
work_item = "W6"
claim = "Client protocol summaries reconcile accepted, closed and active owners without identity disclosure."
implementation = ["crates/hydracache-server/src/management_http.rs#async fn clients"]
