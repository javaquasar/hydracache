routes = ["/management/v1/formation", "/management/v1/cluster/formation", "/management/v1/cluster/members"]
compat_artifacts = ["management-v1-formation-v1"]
privacy_rules = ["opaque-node-id", "no-peer-address"]
receipts = ["target/release-evidence/management-center/0.72/W5-formation.json"]
status = "implemented"

[[claim]]
id = "MC72-PARTITION-PLACEMENT"
