routes = ["/management/v1/clients"]
privacy_rules = ["no-client-address", "no-client-identity"]
receipts = ["target/release-evidence/management-center/0.72/W6.json"]
status = "implemented"

[[claim]]
id = "MC72-TENANT-SCOPE"
work_item = "W7"
claim = "Namespace and cache totals are computed only after tenant authorization."
