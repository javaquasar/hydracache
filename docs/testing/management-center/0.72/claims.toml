schema_version = 1
release = "0.72.0"

[[claim]]
id = "MC72-BASELINE-BOUNDS"
work_item = "W0"
claim = "Every management collection has a frozen cardinality, byte, time or concurrency bound."
implementation = ["docs/testing/management-center/0.72/bounds.toml#max_response_bytes"]
behavior_tests = ["crates/hydracache-server/tests/management_http.rs#source_and_bound_registries_match_executable_contract"]
canaries = ["MC72-W0-BASELINE-DRIFT", "MC72-W0-UNOWNED-FIELD"]
bounds = ["all-registered-bounds"]
receipts = ["target/release-evidence/management-center/0.72/W0.json"]
status = "implemented"

[[claim]]
id = "MC72-SOURCE-OWNERSHIP"
work_item = "W1"
claim = "Every visible value names its authoritative owner and fallback semantics."
implementation = ["docs/testing/management-center/0.72/source-map.toml#fallback"]
behavior_tests = ["crates/hydracache-server/tests/management_http.rs#source_and_bound_registries_match_executable_contract"]
canaries = ["MC72-W1-FALSE-SOURCE", "MC72-W1-ASSET-DRIFT"]
privacy_rules = ["no-secret-source-fields"]
receipts = ["target/release-evidence/management-center/0.72/W1.json"]
status = "implemented"

[[claim]]
id = "MC72-DTO-TRUTH"
work_item = "W2"
claim = "Schema-v1 envelopes reject unknown schema and incoherent complete/unavailable truth."
implementation = ["crates/hydracache-observability/src/management.rs#ManagementEnvelope"]
behavior_tests = ["crates/hydracache-observability/tests/management_schema_072.rs#envelope_rejects_unavailable_complete_and_missing_source_warnings"]
canaries = ["MC72-W2-LEAK-OR-OVERSIZE"]
compat_artifacts = ["management-v1-envelope-v1"]
privacy_rules = ["opaque-node-id"]
receipts = ["target/release-evidence/management-center/0.72/W2.json"]
status = "implemented"

[[claim]]
id = "MC72-READ-ROUTES"
work_item = "W2"
claim = "The bounded management API is internal, authenticated and read only."
implementation = ["crates/hydracache-server/src/management_http.rs#pub(crate) fn routes"]
behavior_tests = ["crates/hydracache-server/tests/management_http.rs#management_routes_require_verified_privileged_identity_before_reading_sources"]
canaries = ["MC72-W2-LEAK-OR-OVERSIZE"]
routes = ["/management/v1/capabilities", "/management/v1/persistence/recovery", "/management/v1/**"]
bounds = ["response-bytes", "page-items", "cursor-count"]
receipts = ["target/release-evidence/management-center/0.72/W2-routes.json"]
status = "implemented"

[[claim]]
id = "MC72-AGGREGATION-FENCING"
work_item = "W3"
claim = "Peer aggregation is committed-roster-only, epoch fenced, deadline bounded and partial on failure."
implementation = ["crates/hydracache-server/src/management_aggregation.rs#ManagementSnapshotAggregator"]
behavior_tests = ["crates/hydracache-server/tests/management_aggregation_072.rs#three_member_http_aggregate_recovers_from_partial_to_complete"]
canaries = ["MC72-W3-CONFUSED-FANOUT"]
routes = ["/cluster/management/v1/snapshot"]
bounds = ["peer-count", "fanout-concurrency", "peer-deadline", "refresh-deadline"]
privacy_rules = ["no-browser-selected-peer"]
receipts = ["target/release-evidence/management-center/0.72/W3.json"]
status = "implemented"

[[claim]]
id = "MC72-DASHBOARD-HISTORY"
work_item = "W4"
claim = "The console renders typed truth and retains only bounded browser-local history."
implementation = ["console/src/controller.ts#renderDegraded", "console/src/history.ts#HISTORY_LIMITS"]
behavior_tests = ["console/tests/console_readonly.spec.js#console_renders_typed_dashboard_and_all_truth_states", "console/src/history.test.ts#survives an accelerated twelve-hour run within production budgets"]
canaries = ["MC72-W4-UNBOUNDED-HISTORY"]
routes = ["/management/v1/dashboard"]
bounds = ["series", "points", "encoded-bytes"]
receipts = ["target/release-evidence/management-center/0.72/W4.json"]
status = "implemented"

[[claim]]
id = "MC72-FORMATION-MEMBERS"
work_item = "W5"
claim = "Discovered or reachable members are not promoted to admitted, current or serving."
implementation = ["crates/hydracache-observability/src/management.rs#ClusterFormationSnapshot"]
behavior_tests = ["crates/hydracache-server/tests/management_topology_072.rs#members_are_committed_epoch_fenced_pseudonymous_and_platform_unknown_is_null"]
