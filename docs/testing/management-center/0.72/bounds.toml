schema_version = 1
release = "0.72.0"

[http]
max_page_items = 100
max_response_bytes = 262144
stale_after_ms = 2000

[cursor]
max_encoded_bytes = 256
ttl_ms = 30000
max_retained_records = 1024
snapshot_binding = ["route_kind", "authority_epoch", "observation_seq"]

[identity]
max_source_node_id_bytes = 256
wire_scheme = "sha256-prefix-v1"
wire_digest_bytes = 16

[envelope]
max_warnings = 32

[cluster_aggregation]
max_committed_peers = 100
max_concurrency = 8
per_peer_timeout_ms = 500
whole_refresh_timeout_ms = 1500
cache_ttl_ms = 1000
max_rpc_request_bytes = 4096
max_rpc_response_bytes = 262144
deduplication_key = ["node_id", "generation", "authority_epoch", "observation_seq"]

[browser_history]
max_series = 24
max_points_per_series = 360
max_total_points = 4320
max_encoded_bytes = 262144
retention = "per-tab since page opened; oldest-first eviction"
pause_conditions = ["document_hidden", "navigator_offline"]
epoch_policy = "clear all series before accepting a different authority epoch"
counter_reset_policy = "emit a gap; never a negative rate"

[placement]
max_candidates = 512
max_selected = 64
max_reasons_per_candidate = 16
max_labels_per_constraint_set = 64
max_label_bytes = 128

[topology]
max_members = 100
max_current_generation_transitions_per_member = 64
max_diagnostic_string_bytes = 128
unknown_trace_status = 404
ownership_binding = ["authority_epoch", "observation_seq"]
