schema_version = 1
release = "0.71"
claim_policy = "accepted-D4-evidence-only"
zero_optional_wins_allowed = true
negative_result_required_when_no_candidate_qualifies = true
deferred_safety_defects_allowed = false

mandatory_foundation = [
  "S1-ownership-closure",
  "corrected-baseline-S4-S5-S7",
  "W1-coherent-production-counters",
  "W2a-retained-byte-accounting",
  "confirmed-unbounded-owner-fixes",
  "per-pr-structural-memory-gate",
  "S8-compatibility",
  "S9-ci-reliability",
  "W13-governance"
]

[[optional_work]]
id = "W2b"
disposition = "deferred"
reason = "bounded and correct: D0 found no fail-open retained-byte admission surface. W2a remains reporting-only, so changing legacy capacity semantics is not justified."
next_evidence = "A future independently reviewed D2 proposal with pre-change pressure evidence"

[[optional_work]]
id = "W5-W7"
disposition = "deferred"
reason = "bounded and correct: D0 shape/tag data attributes live bytes but does not isolate a representation or copy change that clears the frozen minimum effect and regression budgets"
next_evidence = "A separately frozen owner/stack proposal with paired B1/C evidence"

[[optional_work]]
id = "W8"
disposition = "deferred"
reason = "bounded and correct: rewrite/reset owner counters plateau or return to zero while RSS remains at allocator high-water; no same-host allocator candidate has qualified"
next_evidence = "A preregistered same-host system/jemalloc/mimalloc comparison"

[[optional_work]]
id = "W9-W11"
disposition = "deferred"
reason = "bounded and correct: D0 connection and persistence deltas scale with enabled resources, and no optional profile or persistence change has qualified against the frozen budgets"
next_evidence = "A one-factor profile, connection, or persistence proposal reviewed before candidate results"
