schema_version = 1
release = "0.72.0"

[[canary]]
id = "MC72-W2-LEAK-OR-OVERSIZE"
status = "active"
test = "canary_management_api_detects_internal_identity_leak_or_oversize_payload"
command = "cargo test -p hydracache-server --test management_http --locked canary_management_api_detects_internal_identity_leak_or_oversize_payload -- --nocapture"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W2"
expected_failure = "HC-CANARY-RED:MC72-W2"
green_evidence = "The real route remains within its byte ceiling and never serializes internal node identities."
red_evidence = "The mutant serializes ClusterStatus directly; the same oracle detects the leaked identity."

[[canary]]
id = "MC72-W3-CONFUSED-FANOUT"
status = "active"
test = "canary_management_fanout_*"
command = "cargo test -p hydracache-server --lib --locked canary_management_fanout -- --nocapture"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W3"
expected_failure = "HC-CANARY-RED:MC72-W3"
green_evidence = "Only the committed roster is resolved and a cached epoch/sequence never regresses."
red_evidence = "The mutant fans out to an injected metadata-service address or publishes a late older epoch."

[[canary]]
id = "MC72-W4-UNBOUNDED-HISTORY"
status = "active"
test = "ring evicts oldest points by per-series point and byte budgets"
command = "npm --prefix console run unit"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W4"
expected_failure = "HC-CANARY-RED:MC72-W4"
green_evidence = "A twelve-hour accelerated soak stays below frozen series, point and encoded-byte budgets; hidden/offline browser tests pause polling and abort obsolete requests."
red_evidence = "The mutant disables eviction and the same budget oracle fails with the reviewed marker."

[[canary]]
id = "MC72-W5-MIXED-EPOCH"
status = "active"
test = "canary_mixed_epoch_partition_evidence_is_never_published_as_current"
command = "cargo test -p hydracache-server --test management_topology_072 --locked canary_mixed_epoch_partition_evidence_is_never_published_as_current -- --nocapture"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W5-MIXED-EPOCH"
expected_failure = "HC-CANARY-RED:MC72-W5-MIXED-EPOCH"
green_evidence = "A partition observation must match both the current authority epoch and observation sequence; stale ownership becomes unavailable."
red_evidence = "The mutant presents an epoch-70 ownership snapshot as current under epoch 71 and the same oracle rejects it."

[[canary]]
id = "MC72-W5-DISCOVERED-IS-READY"
status = "active"
test = "canary_discovered_or_reachable_member_is_not_inferred_ready"
command = "cargo test -p hydracache-server --test management_topology_072 --locked canary_discovered_or_reachable_member_is_not_inferred_ready -- --nocapture"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W5-DISCOVERED-IS-READY"
expected_failure = "HC-CANARY-RED:MC72-W5-DISCOVERED-IS-READY"
green_evidence = "An unreachable discovered member remains blocked until authenticated, admitted, consensus-current evidence exists."
red_evidence = "The mutant promotes the discovered member to serving and the readiness oracle turns red."

[[canary]]
id = "MC72-W5-NONDETERMINISTIC-PLACEMENT"
status = "active"
test = "canary_placement_normalization_is_permutation_invariant"
command = "cargo test -p hydracache-server --test management_topology_072 --locked canary_placement_normalization_is_permutation_invariant -- --nocapture"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W5-NONDETERMINISTIC-PLACEMENT"
expected_failure = "HC-CANARY-RED:MC72-W5-NONDETERMINISTIC-PLACEMENT"
green_evidence = "Candidate input permutations normalize to identical selected-first wire evidence."
red_evidence = "The mutant reverses normalized candidates and the byte-for-byte determinism oracle fails."

[[canary]]
id = "MC72-W5-COMMIT-IS-APPLY"
status = "active"
test = "canary_committed_placement_is_not_reported_as_applied"
command = "cargo test -p hydracache-server --test management_topology_072 --locked canary_committed_placement_is_not_reported_as_applied -- --nocapture"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W5-COMMIT-IS-APPLY"
expected_failure = "HC-CANARY-RED:MC72-W5-COMMIT-IS-APPLY"
green_evidence = "Committed outcome retains an applied index below commit and is not painted applied."
red_evidence = "The mutant copies commit into apply and changes the outcome; the same oracle turns red."

[[canary]]
id = "MC72-W6-CLOSED-CLIENT-LEAK"
status = "active"
test = "canary_closed_client_owner_cannot_survive_cleanup"
command = "cargo test -p hydracache-server --test management_clients_072 --locked canary_closed_client_owner_cannot_survive_cleanup -- --nocapture"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W6-CLOSED-CLIENT-LEAK"
expected_failure = "HC-CANARY-RED:MC72-W6-CLOSED-CLIENT-LEAK"
green_evidence = "Accepted minus closed reconciles exactly to the live connection owners and detail serialization is disabled without a safe bounded source."
red_evidence = "The mutant retains one active owner after the only accepted client closes; lifecycle validation and the same cleanup oracle fail."

[[canary]]
id = "MC72-W7-CROSS-TENANT"
status = "active"
test = "canary_cross_tenant_source_never_changes_authorized_body"
command = "cargo test -p hydracache-server --test management_namespaces_072 --locked canary_cross_tenant_source_never_changes_authorized_body -- --nocapture"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W7-CROSS-TENANT"
expected_failure = "HC-CANARY-RED:MC72-W7-CROSS-TENANT"
green_evidence = "The tenant roster authorizes the caller before namespace totals are computed; hidden names, keys and payloads never enter the DTO."
red_evidence = "The mutant switches the authorized source to tenant B and the same body scanner detects its distinctive namespace."

[[canary]]
id = "MC72-W8-UNKNOWN-AS-PASS"
