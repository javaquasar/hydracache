schema_version = 1
release = "0.72.0"

[[canary]]
id = "MC72-W0-BASELINE-DRIFT"
status = "active"
test = "canary_w0_missing_baseline_is_rejected"
command = "cargo test -p xtask --test management_center_072 --locked canary_w0_missing_baseline_is_rejected -- --nocapture"
defect_env = "HYDRACACHE_CANARY_DEFECT=MC72-W0-BASELINE-DRIFT"
expected_failure = "HC-CANARY-RED:MC72-W0-BASELINE-DRIFT"
green_evidence = "Frozen management bounds are present and structurally valid."
red_evidence = "The mutant removes the baseline and the same registry oracle turns red."

