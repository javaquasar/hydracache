[advisories]
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"

[[bans.deny]]
name = "sqlparser"
wrappers = ["hydracache-sql-lint"]
reason = "SQL parsing is allowed only through the HydraCache CI/build-time lint crate; it must not enter runtime crates."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Release 0.73 consumes the reviewed observer fork as the exact crates.io package
# hydra-moka 0.12.15-hydra.1. The dependency receipt binds its registry checksum
# to the underlying reviewed source revision and upstream base.
