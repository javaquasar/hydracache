[book]
title = "HydraCache Documentation"
description = "The Rust cache that knows your database: embedded, query-result-aware, correctness-first caching with post-commit invalidation, single-flight loading, and a path to a distributed grid."
authors = ["HydraCache Contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/javaquasar/hydracache"
edit-url-template = "https://github.com/javaquasar/hydracache/edit/main/docs-site/{path}"
site-url = "/hydracache/"
default-theme = "rust"
preferred-dark-theme = "ayu"
additional-css = ["theme/hydracache.css"]

[output.html.search]
enable = true

[output.html.playground]
runnable = false
copyable = true
