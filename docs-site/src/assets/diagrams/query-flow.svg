<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">HydraCache query-result cache flow</title>
  <desc id="desc">Repository code builds a DbCache namespace and query policy. HydraCache checks the local runtime. A cache hit returns a result immediately. A miss runs the database loader and stores the result with tags.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#55606d"/>
    </marker>
  </defs>
  <rect width="920" height="360" rx="10" fill="#fbfcff"/>

  <g fill="#ffffff" stroke="#bdc6d2" stroke-width="2">
    <rect x="34" y="58" width="154" height="74" rx="8"/>
    <rect x="224" y="58" width="154" height="74" rx="8"/>
    <rect x="414" y="58" width="176" height="74" rx="8"/>
    <rect x="626" y="58" width="154" height="74" rx="8"/>
    <path d="M703 174 L790 222 L703 270 L616 222 z"/>
    <rect x="804" y="185" width="86" height="74" rx="8"/>
    <rect x="414" y="204" width="176" height="74" rx="8"/>
    <rect x="224" y="204" width="154" height="74" rx="8"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#252525" text-anchor="middle">
    <text x="111" y="88" font-size="15" font-weight="700">Repository</text>
    <text x="111" y="110" font-size="14">method</text>

    <text x="301" y="88" font-size="15" font-weight="700">DbCache</text>
    <text x="301" y="110" font-size="14">namespace</text>

    <text x="502" y="84" font-size="15" font-weight="700">Query policy</text>
    <text x="502" y="106" font-size="14">key, tags, TTL</text>

    <text x="703" y="84" font-size="15" font-weight="700">HydraCache</text>
    <text x="703" y="106" font-size="14">runtime</text>

    <text x="703" y="218" font-size="15" font-weight="700">Cache hit?</text>

    <text x="847" y="215" font-size="15" font-weight="700">Return</text>
    <text x="847" y="237" font-size="14">result</text>

    <text x="502" y="232" font-size="15" font-weight="700">Run loader</text>
    <text x="502" y="254" font-size="14">SQLx, Diesel, SeaORM</text>

    <text x="301" y="232" font-size="15" font-weight="700">Store result</text>
    <text x="301" y="254" font-size="14">with tags</text>
  </g>

  <g stroke="#55606d" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M188 95 H219"/>
    <path d="M378 95 H409"/>
    <path d="M590 95 H621"/>
    <path d="M703 132 V169"/>
    <path d="M790 222 H799"/>
    <path d="M616 222 H595"/>
    <path d="M414 241 H383"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#475b75" font-size="13" text-anchor="middle">
    <text x="797" y="209">yes</text>
    <text x="604" y="209">no</text>
  </g>
</svg>
