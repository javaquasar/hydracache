<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">HydraCache query-result cache flow</title>
  <desc id="desc">Repository code builds a DbCache namespace and policy. HydraCache returns a cached query result on hit or runs the database loader on miss.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#55606d"/>
    </marker>
  </defs>
  <rect width="920" height="340" rx="10" fill="#fbfcff"/>
  <g fill="#ffffff" stroke="#bdc6d2" stroke-width="2">
    <rect x="34" y="58" width="164" height="74" rx="8"/>
    <rect x="238" y="58" width="154" height="74" rx="8"/>
    <rect x="432" y="58" width="190" height="74" rx="8"/>
    <rect x="662" y="58" width="172" height="74" rx="8"/>
    <path d="M748 190 L840 236 L748 282 L656 236 z"/>
    <rect x="432" y="198" width="190" height="74" rx="8"/>
    <rect x="238" y="198" width="154" height="74" rx="8"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#252525" text-anchor="middle">
    <text x="116" y="88" font-size="15" font-weight="700">Repository</text>
    <text x="116" y="110" font-size="14">method</text>
    <text x="315" y="88" font-size="15" font-weight="700">DbCache</text>
    <text x="315" y="110" font-size="14">namespace</text>
    <text x="527" y="84" font-size="15" font-weight="700">Query policy</text>
    <text x="527" y="106" font-size="14">key, tags, TTL</text>
    <text x="748" y="84" font-size="15" font-weight="700">HydraCache</text>
    <text x="748" y="106" font-size="14">runtime</text>
    <text x="748" y="232" font-size="15" font-weight="700">Cache hit?</text>
    <text x="527" y="228" font-size="15" font-weight="700">Run SQLx, Diesel,</text>
    <text x="527" y="250" font-size="14">SeaORM, or repository loader</text>
    <text x="315" y="228" font-size="15" font-weight="700">Store result</text>
    <text x="315" y="250" font-size="14">with tags</text>
  </g>
  <g stroke="#55606d" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M198 95 H233"/>
    <path d="M392 95 H427"/>
    <path d="M622 95 H657"/>
    <path d="M748 132 V185"/>
    <path d="M656 236 H627"/>
    <path d="M432 236 H397"/>
    <path d="M840 236 C878 196 872 130 838 106"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#475b75" font-size="13">
    <text x="846" y="174">yes: return cached result</text>
    <text x="625" y="218">no</text>
  </g>
</svg>
