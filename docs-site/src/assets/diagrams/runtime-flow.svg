<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">HydraCache runtime flow</title>
  <desc id="desc">Application code passes key, tags, TTL, and refresh policy to HydraCache. A fresh entry is decoded immediately. A miss runs a single-flight loader, stores the encoded value, and then returns the typed value.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#55606d"/>
    </marker>
  </defs>
  <rect width="920" height="390" rx="10" fill="#fffaf6"/>

  <g fill="#ffffff" stroke="#c9c0b8" stroke-width="2">
    <rect x="38" y="64" width="152" height="74" rx="8"/>
    <rect x="228" y="64" width="172" height="74" rx="8"/>
    <rect x="438" y="64" width="154" height="74" rx="8"/>
    <path d="M678 52 L760 101 L678 150 L596 101 z"/>
    <rect x="782" y="64" width="104" height="74" rx="8"/>
    <rect x="500" y="244" width="172" height="74" rx="8"/>
    <rect x="730" y="244" width="154" height="74" rx="8"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#252525" text-anchor="middle">
    <text x="114" y="94" font-size="15" font-weight="700">Application</text>
    <text x="114" y="116" font-size="14">call site</text>

    <text x="314" y="90" font-size="15" font-weight="700">Key + tags</text>
    <text x="314" y="112" font-size="14">TTL / refresh policy</text>

    <text x="515" y="90" font-size="15" font-weight="700">HydraCache</text>
    <text x="515" y="112" font-size="14">local runtime</text>

    <text x="678" y="97" font-size="15" font-weight="700">Fresh</text>
    <text x="678" y="119" font-size="14">entry?</text>

    <text x="834" y="94" font-size="15" font-weight="700">Decode</text>
    <text x="834" y="116" font-size="14">typed value</text>

    <text x="586" y="274" font-size="15" font-weight="700">Single-flight</text>
    <text x="586" y="296" font-size="14">loader</text>

    <text x="807" y="274" font-size="15" font-weight="700">Store</text>
    <text x="807" y="296" font-size="14">encoded value</text>
  </g>

  <g stroke="#55606d" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M190 101 H223"/>
    <path d="M400 101 H433"/>
    <path d="M592 101 H596"/>
    <path d="M760 101 H777"/>
    <path d="M678 150 V205 H586 V239"/>
    <path d="M672 281 H725"/>
    <path d="M807 244 V156 H834 V143"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#6d4b37" font-size="13" text-anchor="middle">
    <text x="770" y="88">yes</text>
    <text x="632" y="190">no: load once</text>
    <text x="515" y="162">stats, diagnostics, events</text>
  </g>
</svg>
